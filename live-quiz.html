<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live-Quiz · Farsi-Lernpfad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .wrap{max-width:1040px}
  .qz-code{font-size:3.2rem;font-weight:800;letter-spacing:.2em;color:var(--lapis);line-height:1}
  .qz-kopf{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:14px 0}
  .qz-block{font-size:.8rem;font-weight:800;color:var(--tinte2);text-transform:uppercase;letter-spacing:.05em}
  .qz-frage{font-size:1.55rem;font-weight:800;line-height:1.35;margin:6px 0 14px}
  .gross .qz-frage{font-size:2.1rem}
  .qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:640px){.qz-opts{grid-template-columns:1fr}}
  .qz-opt{display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:16px 16px;font:inherit;font-weight:800;font-size:1.1rem;color:#fff;text-align:left;cursor:pointer;min-height:64px;position:relative}
  .gross .qz-opt{font-size:1.45rem;min-height:84px}
  .qz-opt .sym{font-size:1.2rem;opacity:.85;width:24px;text-align:center}
  .qz-opt .anz{margin-left:auto;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 10px;font-size:.9rem}
  .o0{background:#A5483F}.o1{background:#2F5D62}.o2{background:#B98A3E}.o3{background:#3C7A55}
  .qz-opt.aus{opacity:.28}
  .qz-opt.richtig{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--gruen)}
  .qz-opt.gewaehlt{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--tinte)}
  .qz-opt:disabled{cursor:default}
  .qz-teile{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
  .qz-teil{border:2px solid var(--linie);background:#fff;border-radius:12px;padding:12px 16px;font:inherit;font-size:1.25rem;font-weight:700;cursor:pointer}
  .gross .qz-teil{font-size:1.7rem}
  .qz-teil:hover:not(:disabled){border-color:var(--lapis)}
  .qz-teil.richtig{background:var(--gruen-hell);border-color:var(--gruen)}
  .qz-teil.gewaehlt{border-color:var(--tinte)}
  .qz-teil .anz{font-size:.8rem;color:var(--tinte2);margin-left:6px}
  .qz-uhr{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:64px;border-radius:50%;background:var(--lapis);color:#fff;font-weight:800;font-size:1.5rem}
  .qz-uhr.knapp{background:var(--granat)}
  .qz-erkl{background:var(--lapis-hell);border:1px solid #cddcd9;border-radius:14px;padding:12px 16px;margin-top:14px;line-height:1.5}
  .gross .qz-erkl{font-size:1.25rem}
  .qz-fa{background:var(--safran-hell);border:1px solid #e6d3ad;border-radius:14px;padding:12px 16px;margin-top:10px}
  .qz-fa .t{font-size:.78rem;font-weight:800;color:#8a6a2a;text-transform:uppercase;letter-spacing:.04em}
  .qz-fa .fa{font-size:1.6rem;line-height:2;text-align:right;display:block}
  .gross .qz-fa .fa{font-size:2.2rem}
  .qz-fa .um{font-style:italic;color:#6b5a2a}
  .qz-ergebnis{border-radius:16px;padding:18px;text-align:center;margin:10px 0;font-weight:800;font-size:1.4rem}
  .qz-ergebnis.ja{background:var(--gruen-hell);color:var(--gruen)}
  .qz-ergebnis.nein{background:var(--granat-hell);color:var(--granat)}
  .qz-ergebnis.info{background:var(--lapis-hell);color:var(--lapis)}
  .qz-rang{display:grid;gap:8px;max-width:640px;margin:0 auto}
  .qz-rang .z{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--linie);border-radius:12px;padding:10px 14px;font-weight:800}
  .qz-rang .z.ich{border-color:var(--lapis);box-shadow:0 0 0 2px var(--lapis-hell)}
  .qz-podest{display:flex;gap:12px;justify-content:center;align-items:flex-end;margin:20px 0}
  .qz-podest div{background:#fff;border:1px solid var(--linie);border-radius:14px 14px 0 0;width:150px;text-align:center;padding:10px;font-weight:800}
  .qz-podest .m{font-size:2.4rem}
  .qz-tn{display:flex;flex-wrap:wrap;gap:8px}
  .qz-tn span{background:#fff;border:1px solid var(--linie);border-radius:999px;padding:6px 12px;font-weight:800}
  .qz-tn button{border:0;background:none;color:var(--tinte2);cursor:pointer;font-size:.9rem}
  .qz-fort{height:6px;background:var(--papier2);border-radius:999px;overflow:hidden;margin:6px 0 12px}
  .qz-fort i{display:block;height:100%;background:var(--lapis)}
  .seg{display:inline-flex;border:1px solid var(--linie);border-radius:10px;overflow:hidden;flex-wrap:wrap}
  .seg button{border:0;background:#fff;padding:6px 12px;font:inherit;font-size:.86rem;font-weight:700;cursor:pointer}
  .seg button.an{background:var(--lapis);color:#fff}
  .klein-h{font-size:.78rem;font-weight:800;color:var(--tinte2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
  .qz-ausw .z{display:grid;grid-template-columns:1fr 70px 120px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linie)}
  .qz-ausw .bar{height:10px;border-radius:999px;background:var(--papier2);overflow:hidden}.qz-ausw .bar i{display:block;height:100%}
  .qz-qr{background:#fff;padding:8px;border-radius:10px;border:1px solid var(--linie);display:inline-block}
  @media print{.kopf,.nodruck{display:none!important}}
</style>
</head>
<body>
<header class="kopf">
  <div class="wrap">
    <a href="aktivitaeten.html" class="medaillon" style="text-decoration:none">فا</a>
    <div><h1 id="kopfTitel">Live-Quiz</h1><div class="unter">Aktivität · Farsi-Lernpfad</div></div>
    <div class="rechts"><span class="kopf-btn" id="kopfInfo" style="background:transparent;border-color:transparent"></span></div>
  </div>
</header>
<main class="wrap" style="padding-bottom:60px"><div id="app"><p class="muted" style="margin-top:30px">Lade …</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/core.js"></script>
<script src="assets/live-tools.js"></script>
<script src="assets/quiz/sprache-verstehen.js"></script>
<script>
/* ===================== Logik (rein, auch für Tests) ===================== */
window.QUIZ_ENGINE = (function () {
  const liste = (Q, kurz) => Q.fragen.map((f, i) => i).filter(i => !kurz || Q.fragen[i].kurz);
  const bewertet = f => f.typ !== "umfrage";
  /* Punkte: richtig = 1000 (ohne Zeit) bzw. 500–1000 je nach Schnelligkeit */
  function punkteFuer(f, ant, zeit) {
    if (!ant || !bewertet(f) || ant.w !== f.r) return 0;
    if (!zeit) return 1000;
    const anteil = Math.max(0, Math.min(1, (ant.t || 0) / (zeit * 1000)));
    return Math.round(1000 - 500 * anteil);
  }
  /* bis einschließlich Position bis (nur aufgelöste Fragen zählen) */
  function stand(G, Q, bis) {
    const L = liste(Q, G.kurz), sp = G.spieler || {};
    return Object.entries(sp).filter(([, s]) => s && s.name).map(([id, s]) => {
      let p = 0, r = 0, n = 0;
      L.slice(0, bis + 1).forEach(qi => { const f = Q.fragen[qi], a = (s.a || {})["q" + qi]; if (!bewertet(f)) return; n++; const x = punkteFuer(f, a, G.zeit); p += x; if (x) r++; });
      return { id, name: s.name, punkte: p, richtig: r, von: n };
    }).sort((a, b) => b.punkte - a.punkte || a.name.localeCompare(b.name));
  }
  function verteilung(G, qi, f) {
    const z = f.a.map(() => 0); let n = 0;
    Object.values(G.spieler || {}).forEach(s => { const a = s && s.name && (s.a || {})["q" + qi]; if (a && a.w != null && z[a.w] != null) { z[a.w]++; n++; } });
    return { z, n };
  }
  return { liste, bewertet, punkteFuer, stand, verteilung };
})();

/* ===================== Seite ===================== */
(function () {
  const F = window.FARSI, { $, $$, esc, toast } = F, E = window.QUIZ_ENGINE, LT = window.LIVE_TOOLS;
  const qs = new URLSearchParams(location.search);
  const MODUS = qs.get("solo") ? "solo" : qs.get("leitung") ? "leitung" : "spieler";
  const QID = qs.get("quiz") || "sprache-verstehen";
  const Q = (window.QUIZZE || {})[QID];
  let CODE = (qs.get("code") || "").replace(/\D/g, "") || null;
  let G = null, REF = null, ME = null, BEAMER = true;
  const gesehen = {};          /* Spieler: wann die Frage hier zum ersten Mal erschien (lokale Uhr) */
  const app = () => $("#app");
  const gRef = c => F.ref(`live/quiz/${c}`);
  const SYM = ["▲", "◆", "●", "■"];
  const L = () => E.liste(Q, G && G.kurz);
  const aktFrage = () => { const qi = L()[G.i || 0]; return { qi, f: Q.fragen[qi] }; };
  const SP = () => Object.entries((G && G.spieler) || {}).filter(([, s]) => s && s.name);

  if (!Q) { app().innerHTML = `<div class="karte" style="margin-top:20px">Dieses Quiz gibt es nicht.</div>`; return; }
  $("#kopfTitel").textContent = Q.titel;

  function fehler(e, hart) {
    console.error(e);
    if (!hart) { toast("Das hat nicht geklappt – bitte noch einmal tippen."); return; }
    app().innerHTML = `<div class="karte" style="margin-top:20px"><b>Das hat nicht geklappt.</b><p class="klein muted">${esc(e && e.message || e)}</p><p class="klein">Bitte die Seite neu laden. Lehrkraft: Sind die Regeln aus <code>firebase-regeln.json</code> veröffentlicht?</p></div>`;
  }
  const upd = o => gRef(CODE).update(o).catch(e => fehler(e));
  function hoere(c) {
    if (REF) REF.off();
    REF = gRef(c);
    REF.on("value", s => { G = s.val(); if (MODUS !== "leitung") LT.pruefeNeuLaden(G); if (LT.tipptGerade(zeichne)) return; zeichne(); }, e => fehler(e, true));
  }

  /* ---------- Bausteine ---------- */
  function faBox(f) {
    if (!f.fa) return "";
    return `<div class="qz-fa"><div class="t">🔎 Und im Persischen?</div><span class="fa">${esc(f.fa.fa)}</span><div class="um">${esc(f.fa.um)}</div><div>${esc(f.fa.de)}</div></div>`;
  }
  function kopfFrage(pos, n, f) {
    return `<div class="qz-block">${esc(Q.bloecke[f.b] || "")} · Frage ${pos + 1} von ${n}${f.typ === "umfrage" ? " · Umfrage" : ""}</div><div class="qz-fort"><i style="width:${Math.round((pos + 1) / n * 100)}%"></i></div>`;
  }
  /* Antwortfelder. modus: "waehlen" (Spieler), "zeigen" (Beamer), "loesung" (mit Zählung/Lösung) */
  function optionen(f, qi, modus, meine) {
    const V = modus === "loesung" ? E.verteilung(G, qi, f) : null;
    const istR = i => E.bewertet(f) && i === f.r;
    if (f.typ === "tippen") {
      return `<div class="qz-teile">${f.a.map((t, i) => `<button class="qz-teil ${modus === "loesung" && istR(i) ? "richtig" : ""} ${meine === i ? "gewaehlt" : ""}" ${modus === "waehlen" ? `data-w="${i}"` : "disabled"}>${esc(t)}${V ? `<span class="anz">${V.z[i]}</span>` : ""}</button>`).join("")}</div>`;
    }
    return `<div class="qz-opts">${f.a.map((t, i) => {
      const k = ["qz-opt", "o" + (i % 4)];
      if (modus === "loesung" && E.bewertet(f) && !istR(i)) k.push("aus");
      if (modus === "loesung" && istR(i)) k.push("richtig");
      if (meine === i) k.push("gewaehlt");
      return `<button class="${k.join(" ")}" ${modus === "waehlen" ? `data-w="${i}"` : "disabled"}><span class="sym">${SYM[i % 4]}</span><span>${esc(t)}</span>${V ? `<span class="anz">${V.z[i]}</span>` : ""}</button>`;
    }).join("")}</div>`;
  }
  function rangHtml(st, max, meinId) {
    return `<div class="qz-rang">${st.slice(0, max).map((x, i) => `<div class="z ${x.id === meinId ? "ich" : ""}"><span>${i + 1}.</span><span>${esc(x.name)}</span><span>${x.punkte} P.</span></div>`).join("")}</div>`;
  }
  function podestHtml(st) {
    const p = [st[1], st[0], st[2]], h = [110, 150, 80], m = ["🥈", "🥇", "🥉"];
    return `<div class="qz-podest">${p.map((x, i) => x ? `<div style="height:${h[i]}px"><div class="m">${m[i]}</div>${esc(x.name)}<div class="klein muted">${x.punkte} P.</div></div>` : "").join("")}</div>`;
  }
  /* Countdown (lokale Uhr) */
  setInterval(() => $$(".qz-uhr[data-ende]").forEach(u => {
    const rest = Math.max(0, Math.ceil((+u.dataset.ende - Date.now()) / 1000));
    u.textContent = rest; u.classList.toggle("knapp", rest <= 5);
  }), 250);
  const uhrHtml = ende => ende ? `<span class="qz-uhr" data-ende="${ende}">${Math.max(0, Math.ceil((ende - Date.now()) / 1000))}</span>` : "";

  /* =====================================================================
     LEITUNG (Lehrkraft, Leinwand)
     ===================================================================== */
  function startLeitung() {
    firebase.auth().onAuthStateChanged(u => {
      if (!u) { app().innerHTML = `<div class="karte" style="margin-top:20px"><h2>Nur für Lehrkräfte</h2><p>Bitte zuerst in der <a href="konsole.html">Konsole</a> anmelden.</p><p><a href="?solo=1">Allein üben</a></p></div>`; return; }
      LT.verbindung(null);
      if (CODE) hoere(CODE); else zeichneNeu();
    });
    setInterval(autoAufloesen, 500);
    document.addEventListener("keydown", e => { if (MODUS === "leitung" && (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") && !e.target.matches("input,textarea")) { const b = $("#weiter") || $("#aufloesen") || $("#start"); if (b) { e.preventDefault(); b.click(); } } });
  }
  function zeichneNeu() {
    const n = E.liste(Q, false).length, k = E.liste(Q, true).length;
    app().innerHTML = `<div class="karte" style="margin-top:20px"><div style="font-size:2.2rem">${Q.icon}</div><h2 style="margin:4px 0">${esc(Q.titel)}</h2><p class="muted" style="margin-top:0">${esc(Q.untertitel)}</p>
      <p>Wie ein Kahoot: Die Fragen erscheinen auf der Leinwand, alle antworten auf dem eigenen Gerät. Nach jeder Frage gibt es eine kurze Erklärung – oft mit einem Blick aufs Persische.</p>
      <p class="klein">Themen: ${Object.values(Q.bloecke).map(esc).join(" · ")}</p>
      <p class="klein muted">Die Teilnehmenden brauchen <b>keinen Zugangscode</b> – nur den Spielcode und ihren Vornamen.</p>
      <div class="btnreihe"><button class="btn" data-neu="1">▶ Kurzfassung (${k} Fragen, ca. 20 Min.)</button><button class="btn zwei" data-neu="0">▶ Langfassung (${n} Fragen, ca. 40 Min.)</button></div></div>`;
    $$("[data-neu]").forEach(b => b.onclick = async () => {
      const d = { erstellt: Date.now(), quiz: QID, kurz: b.dataset.neu === "1", zeit: 30, phase: "lobby", i: 0 };
      try { CODE = await LT.neueRunde(gRef, d); } catch (e) { return fehler(e, true); }
      history.replaceState(null, "", `?leitung=1&code=${CODE}${QID !== "sprache-verstehen" ? "&quiz=" + QID : ""}`);
      hoere(CODE);
    });
  }
  const linkFuer = c => location.origin + location.pathname + "?code=" + c;
  function autoAufloesen() {
    if (MODUS !== "leitung" || !G || G.phase !== "frage") return;
    const { qi } = aktFrage(), sp = SP().filter(([, s]) => s.online !== false);
    const alle = sp.length > 0 && sp.every(([, s]) => (s.a || {})["q" + qi]);
    const zeitUm = G.zeit && G.fstart && Date.now() > G.fstart + G.zeit * 1000 + 1200;
    if (alle || zeitUm) { G.phase = "loesung"; upd({ phase: "loesung" }); }
  }
  function zeichneLeitung() {
    if (!G) { app().innerHTML = `<div class="karte" style="margin-top:20px">Diese Runde gibt es nicht (mehr). <a href="?leitung=1">Neue Runde</a></div>`; return; }
    const n = L().length, sp = SP();
    let h = `<div class="qz-kopf nodruck"><div style="display:flex;gap:14px;align-items:center"><div><div class="klein muted">Spielcode</div><div class="qz-code">${CODE}</div></div>
      ${G.phase !== "lobby" ? `<div class="klein muted">${sp.length} dabei</div>` : ""}</div><div class="btnreihe">`;
    if (G.phase !== "lobby" && G.phase !== "ende") h += `<button class="btn zwei klein" id="beamerBtn">${BEAMER ? "⚙️ Steuerung" : "🖥️ Leinwand"}</button>`;
    if (G.phase !== "ende" && G.phase !== "lobby") h += `<button class="btn rot klein" id="ende">⏹ beenden</button>`;
    h += `</div></div>`;

    if (G.phase === "lobby") {
      h += `<div class="karte" style="display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center">
        <div><h2 style="margin-top:0">${Q.icon} ${esc(Q.titel)}</h2>
          <p style="font-size:1.15rem">Öffnet <b>${esc(linkFuer("").replace(/^https?:\/\//, "").replace("?code=", ""))}</b><br>und gebt den Code <b>${CODE}</b> ein – oder scannt den QR-Code.</p>
          <div class="klein-h">Länge</div><div class="seg"><button class="${G.kurz ? "an" : ""}" data-kurz="1">kurz · ${E.liste(Q, true).length} Fragen</button><button class="${G.kurz ? "" : "an"}" data-kurz="0">lang · ${E.liste(Q, false).length} Fragen</button></div>
          <div class="klein-h">Zeit pro Frage</div><div class="seg">${[20, 30, 45, 0].map(z => `<button class="${(G.zeit || 0) === z ? "an" : ""}" data-zeit="${z}">${z ? z + " Sek." : "ohne Zeit"}</button>`).join("")}</div>
          <p class="klein muted">Mit Zeit: schnelle richtige Antworten bringen mehr Punkte (500–1000). Ohne Zeit: jede richtige Antwort 1000.</p></div>
        <div style="text-align:center"><div class="qz-qr" id="qr"></div></div></div>
        <div class="karte" style="margin-top:12px"><h3 style="margin-top:0">Dabei (${sp.length})</h3><div class="qz-tn">${sp.map(([id, s]) => `<span>${esc(s.name)} <button data-weg="${id}" title="entfernen">✕</button></span>`).join("") || `<span class="muted" style="border:0">Noch niemand da …</span>`}</div>
        <div class="btnreihe" style="margin-top:14px"><button class="btn" id="start" ${sp.length ? "" : "disabled"}>▶ Quiz starten</button></div></div>`;
    } else if (G.phase === "ende") {
      const st = E.stand(G, Q, n - 1);
      h += `<div class="karte" style="text-align:center"><h2 style="margin:0">🏆 Geschafft!</h2>${podestHtml(st)}${rangHtml(st, 50)}</div>` + auswertungHtml() +
        `<div class="btnreihe nodruck" style="margin-top:12px"><button class="btn zwei" id="drucken">🖨️ Auswertung drucken</button><a class="btn zwei" href="?leitung=1" style="text-decoration:none">Neue Runde</a></div>`;
    } else {
      const pos = G.i || 0, { qi, f } = aktFrage(), V = E.verteilung(G, qi, f);
      const ende = G.phase === "frage" && G.zeit && G.fstart ? G.fstart + G.zeit * 1000 : 0;
      if (G.phase === "rangliste") {
        h += `<div class="karte ${BEAMER ? "gross" : ""}" style="text-align:center"><h2 style="margin-top:0">📊 Zwischenstand nach Frage ${pos + 1}</h2>${rangHtml(E.stand(G, Q, pos), 8)}</div>`;
      } else {
        h += `<div class="karte ${BEAMER ? "gross" : ""}">${kopfFrage(pos, n, f)}
          <div style="display:flex;gap:14px;align-items:flex-start;justify-content:space-between"><div class="qz-frage">${esc(f.frage)}</div>${uhrHtml(ende)}</div>
          ${optionen(f, qi, G.phase === "loesung" ? "loesung" : "zeigen")}
          ${G.phase === "frage" ? `<p class="muted" style="font-weight:800;margin:12px 0 0">✍️ ${V.n} von ${sp.length} haben geantwortet</p>` : `<div class="qz-erkl">${E.bewertet(f) ? `<b>${Math.round(V.n ? V.z[f.r] / V.n * 100 : 0)} % richtig.</b> ` : ""}${esc(f.erkl)}</div>${faBox(f)}`}
        </div>`;
      }
      h += `<div class="btnreihe nodruck" style="margin-top:12px">`;
      if (G.phase === "frage") h += `<button class="btn" id="aufloesen">⏩ Auflösen</button>`;
      else {
        const letzte = pos >= n - 1;
        if (G.phase === "loesung" && !letzte) h += `<button class="btn zwei" id="zwischen">📊 Zwischenstand</button>`;
        h += `<button class="btn" id="weiter">${letzte ? "🏆 Ergebnis zeigen" : "Weiter ➜ Frage " + (pos + 2)}</button>`;
      }
      h += `<span class="klein muted" style="align-self:center">Tipp: Leertaste = weiter</span></div>`;
      if (!BEAMER) h += `<div class="karte" style="margin-top:12px"><h3 style="margin-top:0">Wer hat geantwortet?</h3><div class="qz-tn">${sp.map(([id, s]) => { const a = (s.a || {})["q" + qi]; const ok = a && E.bewertet(f) && G.phase !== "frage" ? (a.w === f.r ? " ✅" : " ❌") : a ? " ✔" : " …";
        return `<span style="${s.online === false ? "opacity:.5" : ""}">${esc(s.name)}${ok}</span>`; }).join("")}</div>
        <div class="lt-werkzeug" style="margin-top:10px"><button class="btn zwei klein" id="reload">🔄 Alle Geräte neu laden</button></div></div>`;
    }
    LT.render(app(), h);
    verdrahteLeitung();
    if (G.phase === "lobby") { const q = $("#qr"); if (q && window.QRCode) { q.innerHTML = ""; try { new QRCode(q, { text: linkFuer(CODE), width: 180, height: 180 }); } catch (e) { } } }
  }
  function auswertungHtml() {
    const n = L().length;
    return `<div class="karte qz-ausw" style="margin-top:12px"><h3 style="margin-top:0">Auswertung pro Frage</h3><p class="klein muted">Wo lohnt es sich, im Kurs noch einmal hinzuschauen?</p>
      ${L().map((qi, pos) => { const f = Q.fragen[qi], V = E.verteilung(G, qi, f);
        if (!E.bewertet(f)) return `<div class="z"><span>${pos + 1}. ${esc(f.frage)}</span><span class="klein muted">Umfrage</span><span class="klein">${f.a.map((t, i) => `${esc(t)}: ${V.z[i]}`).join(" · ")}</span></div>`;
        const p = V.n ? Math.round(V.z[f.r] / V.n * 100) : 0, c = p >= 70 ? "var(--gruen)" : p >= 40 ? "var(--safran)" : "var(--granat)";
        return `<div class="z"><span>${pos + 1}. ${esc(f.frage)}</span><b style="color:${c}">${p} %</b><span class="bar"><i style="width:${p}%;background:${c}"></i></span></div>`; }).join("")}</div>`;
  }
  function verdrahteLeitung() {
    const b = id => $("#" + id);
    $$("[data-kurz]").forEach(x => x.onclick = () => upd({ kurz: x.dataset.kurz === "1" }));
    $$("[data-zeit]").forEach(x => x.onclick = () => upd({ zeit: +x.dataset.zeit }));
    $$("[data-weg]").forEach(x => x.onclick = () => gRef(CODE).child("spieler/" + x.dataset.weg).set(null).catch(e => fehler(e)));
    if (b("start")) b("start").onclick = () => upd({ phase: "frage", i: 0, fstart: Date.now(), start: Date.now() });
    if (b("aufloesen")) b("aufloesen").onclick = () => upd({ phase: "loesung" });
    if (b("zwischen")) b("zwischen").onclick = () => upd({ phase: "rangliste" });
    if (b("weiter")) b("weiter").onclick = () => { const pos = G.i || 0; if (pos >= L().length - 1) upd({ phase: "ende" }); else upd({ phase: "frage", i: pos + 1, fstart: Date.now() }); };
    if (b("ende")) b("ende").onclick = () => { if (confirm("Quiz beenden und Ergebnis zeigen?")) upd({ phase: "ende" }); };
    if (b("beamerBtn")) b("beamerBtn").onclick = () => { BEAMER = !BEAMER; zeichne(); };
    if (b("reload")) b("reload").onclick = () => { if (confirm("Alle Geräte neu laden?")) upd({ reload: Date.now() }); };
    if (b("drucken")) b("drucken").onclick = () => window.print();
  }

  /* =====================================================================
     SPIELER (eigenes Gerät, ohne Zugangscode)
     ===================================================================== */
  function pid() {
    const s = F.sitzung && F.sitzung(); if (s && s.code) return s.code;
    let p = null; try { p = localStorage.getItem("farsi_quiz_pid"); if (!p) { p = "q" + Math.random().toString(36).slice(2, 9); localStorage.setItem("farsi_quiz_pid", p); } } catch (e) { p = "q" + Math.random().toString(36).slice(2, 9); }
    return p;
  }
  function gespeicherterName() { const s = F.sitzung && F.sitzung(); if (s && s.name) return s.name; try { return localStorage.getItem("farsi_quiz_name") || ""; } catch (e) { return ""; } }
  function startSpieler() {
    ME = { id: pid(), name: gespeicherterName() };
    const s = F.sitzung && F.sitzung();
    if (CODE && s && s.name) beitreten(CODE, s.name); else zeichneBeitritt();
  }
  function zeichneBeitritt(meld) {
    app().innerHTML = `<div class="karte" style="margin-top:20px;max-width:480px;margin-inline:auto;text-align:center"><div style="font-size:3rem">${Q.icon}</div><h2 style="margin:0 0 6px">Live-Quiz</h2>
      <p>Gib den <b>Spielcode</b> von der Leinwand und deinen <b>Vornamen</b> ein.</p>
      <div style="display:grid;gap:10px;max-width:280px;margin:0 auto">
        <input class="feld" id="code" inputmode="numeric" maxlength="4" placeholder="Spielcode" value="${esc(CODE || "")}" style="text-align:center;font-size:1.4rem;letter-spacing:.2em">
        <input class="feld" id="name" maxlength="20" placeholder="Vorname" value="${esc(ME.name)}" autocomplete="given-name" style="text-align:center;font-size:1.15rem">
        <button class="btn" id="los">Mitspielen ➜</button></div>
      <p class="klein" style="color:var(--granat);min-height:1.2em">${meld || ""}</p><p class="klein muted">Es wird nur dein Vorname gespeichert.</p><p class="klein"><a href="?solo=1">Lieber allein üben</a></p></div>`;
    $("#los").onclick = () => beitreten($("#code").value.replace(/\D/g, ""), $("#name").value.trim());
    $$("#code,#name").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") $("#los").click(); }));
    if (CODE && ME.name) $("#name").focus();
  }
  async function beitreten(c, n) {
    if (!/^\d{4}$/.test(c)) return zeichneBeitritt("Der Spielcode hat vier Ziffern.");
    if (!n) return zeichneBeitritt("Bitte gib deinen Vornamen ein.");
    n = n.split(/\s+/)[0].slice(0, 20);
    let g; try { g = (await F.mitTimeout(gRef(c).once("value"), 8000)).val(); } catch (e) { return fehler(e, true); }
    if (!g || !g.quiz) { CODE = null; return zeichneBeitritt("Diesen Spielcode gibt es nicht."); }
    CODE = c; ME.name = n; try { localStorage.setItem("farsi_quiz_name", n); } catch (e) { }
    history.replaceState(null, "", "?code=" + c);
    const alt = (g.spieler || {})[ME.id];
    try { if (alt) await gRef(c).child(`spieler/${ME.id}/name`).set(n); else await gRef(c).child("spieler/" + ME.id).set({ name: n, ts: Date.now() }); } catch (e) { return fehler(e, true); }
    LT.verbindung(gRef(c).child("spieler/" + ME.id));
    hoere(c);
  }
  function zeichneSpieler() {
    if (!G) return zeichneBeitritt("Diese Runde wurde beendet.");
    const ich = (G.spieler || {})[ME.id];
    if (!ich) { app().innerHTML = `<div class="karte" style="margin-top:20px;text-align:center">Du bist nicht (mehr) in dieser Runde.<br><br><button class="btn" id="nochmal">Wieder mitspielen</button></div>`; $("#nochmal").onclick = () => beitreten(CODE, ME.name); return; }
    $("#kopfInfo").textContent = ich.name;
    const n = L().length;
    let h = "";
    if (G.phase === "lobby") {
      h = `<div class="karte" style="margin-top:20px;text-align:center"><div style="font-size:3rem">${Q.icon}</div><h2 style="margin:0">Hallo ${esc(ich.name)}!</h2><p>Du bist dabei. Gleich geht es los …</p>
        <p class="klein muted">Schau auf die Leinwand. Antworte auf deinem Gerät – je schneller (und richtig), desto mehr Punkte.</p>
        <p class="klein"><button class="btn zwei klein" id="umbenennen">Namen ändern</button></p></div>`;
    } else if (G.phase === "ende") {
      const st = E.stand(G, Q, n - 1), platz = st.findIndex(x => x.id === ME.id), x = st[platz];
      h = `<div class="karte" style="margin-top:20px;text-align:center"><h2 style="margin:0">🏆 Geschafft!</h2>
        <div class="qz-ergebnis info">Platz ${platz + 1} von ${st.length} · ${x ? x.punkte : 0} Punkte<br><span class="klein">${x ? x.richtig : 0} von ${x ? x.von : 0} richtig</span></div>${podestHtml(st)}</div>`;
    } else {
      const pos = G.i || 0, { qi, f } = aktFrage(), meine = (ich.a || {})["q" + qi];
      if (G.phase === "rangliste") {
        const st = E.stand(G, Q, pos), platz = st.findIndex(x => x.id === ME.id);
        h = `<div class="karte" style="margin-top:20px;text-align:center"><h2 style="margin-top:0">📊 Zwischenstand</h2><div class="qz-ergebnis info">Du bist auf Platz ${platz + 1} von ${st.length}</div>${rangHtml(st, 5, ME.id)}</div>`;
      } else if (G.phase === "frage") {
        if (!gesehen[pos]) gesehen[pos] = Date.now();
        const ende = G.zeit ? gesehen[pos] + G.zeit * 1000 : 0, vorbei = ende && Date.now() > ende + 1500;
        h = `<div class="karte" style="margin-top:14px">${kopfFrage(pos, n, f)}<div style="display:flex;gap:12px;justify-content:space-between;align-items:flex-start"><div class="qz-frage">${esc(f.frage)}</div>${meine ? "" : uhrHtml(ende)}</div>
          ${meine ? optionen(f, qi, "zeigen", meine.w) + `<div class="qz-ergebnis info" style="font-size:1.1rem">✔ Antwort gespeichert – warte auf die Auflösung …</div>`
            : vorbei ? `<div class="qz-ergebnis nein" style="font-size:1.1rem">⏰ Die Zeit ist um.</div>` : optionen(f, qi, "waehlen")}</div>`;
      } else {
        const st = E.stand(G, Q, pos), platz = st.findIndex(x => x.id === ME.id), x = st[platz], p = E.punkteFuer(f, meine, G.zeit);
        const erg = !E.bewertet(f) ? `<div class="qz-ergebnis info">📊 Umfrage – danke!</div>`
          : !meine ? `<div class="qz-ergebnis nein">⏰ Keine Antwort</div>`
          : p ? `<div class="qz-ergebnis ja">✅ Richtig! +${p}</div>` : `<div class="qz-ergebnis nein">❌ Leider falsch</div>`;
        h = `<div class="karte" style="margin-top:14px">${kopfFrage(pos, n, f)}${erg}<div class="qz-frage" style="font-size:1.2rem">${esc(f.frage)}</div>${optionen(f, qi, "loesung", meine ? meine.w : null)}
          <div class="qz-erkl">${esc(f.erkl)}</div>${faBox(f)}<p class="muted" style="text-align:center;font-weight:800;margin:14px 0 0">${x ? x.punkte : 0} Punkte · Platz ${platz + 1} von ${st.length}</p></div>`;
      }
    }
    LT.render(app(), h);
    $$("[data-w]").forEach(b => b.onclick = () => antworten(+b.dataset.w));
    const u = $("#umbenennen"); if (u) u.onclick = () => { const nn = prompt("Dein Vorname:", ich.name); if (nn && nn.trim()) { ME.name = nn.trim().split(/\s+/)[0].slice(0, 20); try { localStorage.setItem("farsi_quiz_name", ME.name); } catch (e) { } gRef(CODE).child(`spieler/${ME.id}/name`).set(ME.name).catch(e => fehler(e)); } };
  }
  const geschickt = new Set();   /* Doppelklick-Schutz pro Frage */
  function antworten(w) {
    if (!G || G.phase !== "frage") return;
    const pos = G.i || 0, { qi } = aktFrage();
    if (geschickt.has(qi) || ((G.spieler[ME.id] || {}).a || {})["q" + qi]) return;
    geschickt.add(qi);
    const t = Date.now() - (gesehen[pos] || Date.now());
    gRef(CODE).child(`spieler/${ME.id}/a/q${qi}`).set({ w, t }).catch(e => { geschickt.delete(qi); fehler(e); });
  }

  /* =====================================================================
     ALLEIN ÜBEN (ohne Firebase)
     ===================================================================== */
  let SOLO = null;
  function startSolo() {
    const n = E.liste(Q, false).length, k = E.liste(Q, true).length;
    app().innerHTML = `<div class="karte" style="margin-top:20px;max-width:620px;margin-inline:auto"><div style="font-size:2.4rem">${Q.icon}</div><h2 style="margin:4px 0">${esc(Q.titel)} – allein üben</h2><p class="muted" style="margin-top:0">${esc(Q.untertitel)}</p>
      <p>Ohne Zeitdruck: Nach jeder Frage siehst du die Erklärung.</p><div class="btnreihe"><button class="btn" data-solo="1">Kurzfassung (${k} Fragen)</button><button class="btn zwei" data-solo="0">Langfassung (${n} Fragen)</button></div></div>`;
    $$("[data-solo]").forEach(b => b.onclick = () => { SOLO = { kurz: b.dataset.solo === "1", pos: 0, a: {}, zeigen: false }; G = { kurz: SOLO.kurz }; zeichneSolo(); });
  }
  function zeichneSolo() {
    const LL = E.liste(Q, SOLO.kurz), n = LL.length;
    if (SOLO.pos >= n) {
      const bew = LL.filter(qi => E.bewertet(Q.fragen[qi])), r = bew.filter(qi => SOLO.a[qi] === Q.fragen[qi].r).length;
      const falsch = bew.filter(qi => SOLO.a[qi] !== Q.fragen[qi].r);
      app().innerHTML = `<div class="karte" style="margin-top:20px;max-width:720px;margin-inline:auto;text-align:center"><h2 style="margin:0">🏁 Fertig!</h2><div class="qz-ergebnis ${r / bew.length >= .7 ? "ja" : "info"}">${r} von ${bew.length} richtig</div>
        ${falsch.length ? `<div style="text-align:left"><div class="klein-h">Noch einmal anschauen</div>${falsch.map(qi => `<div class="qz-erkl" style="margin-top:8px"><b>${esc(Q.fragen[qi].frage)}</b><br>✔ ${esc(Q.fragen[qi].a[Q.fragen[qi].r])}<br><span class="klein">${esc(Q.fragen[qi].erkl)}</span></div>`).join("")}</div>` : ""}
        <div class="btnreihe" style="justify-content:center;margin-top:14px"><button class="btn" id="nochmal">Noch einmal</button></div></div>`;
      $("#nochmal").onclick = startSolo; return;
    }
    const qi = LL[SOLO.pos], f = Q.fragen[qi], meine = SOLO.a[qi];
    let h = `<div class="karte" style="margin-top:14px;max-width:820px;margin-inline:auto">${kopfFrage(SOLO.pos, n, f)}`;
    if (!SOLO.zeigen) h += `<div class="qz-frage">${esc(f.frage)}</div>${optionen(f, qi, "waehlen")}`;
    else {
      const erg = !E.bewertet(f) ? `<div class="qz-ergebnis info">📊 Umfrage – im Kurs seht ihr, was die anderen sagen.</div>` : meine === f.r ? `<div class="qz-ergebnis ja">✅ Richtig!</div>` : `<div class="qz-ergebnis nein">❌ Leider falsch</div>`;
      /* Lösung ohne Zählung zeigen */
      const g0 = G; G = { spieler: {} };
      h += erg + `<div class="qz-frage" style="font-size:1.2rem">${esc(f.frage)}</div>${optionen(f, qi, "loesung", meine).replace(/<span class="anz">0<\/span>/g, "")}`;
      G = g0;
      h += `<div class="qz-erkl">${esc(f.erkl)}</div>${faBox(f)}<div class="btnreihe" style="margin-top:14px"><button class="btn" id="weiter">${SOLO.pos >= n - 1 ? "Ergebnis ➜" : "Weiter ➜"}</button></div>`;
    }
    app().innerHTML = h + `</div>`;
    $$("[data-w]").forEach(b => b.onclick = () => { SOLO.a[qi] = +b.dataset.w; SOLO.zeigen = true; zeichneSolo(); });
    const w = $("#weiter"); if (w) w.onclick = () => { SOLO.pos++; SOLO.zeigen = false; zeichneSolo(); window.scrollTo(0, 0); };
  }

  function zeichne() { MODUS === "leitung" ? zeichneLeitung() : zeichneSpieler(); }
  window.QUIZ_APP = { get G() { return G; }, Q };
  if (MODUS === "solo") startSolo();
  else { F.initFB(); MODUS === "leitung" ? startLeitung() : startSpieler(); }
})();
</script>
</body>
</html>
