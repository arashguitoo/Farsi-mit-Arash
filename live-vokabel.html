<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabelspiele · Farsi-Lernpfad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .wrap{max-width:1040px}
  .vk-code{font-size:3rem;font-weight:800;letter-spacing:.2em;color:var(--lapis);line-height:1}
  .vk-kopf{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:14px 0}
  .klein-h{font-size:.78rem;font-weight:800;color:var(--tinte2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
  .seg{display:inline-flex;border:1px solid var(--linie);border-radius:10px;overflow:hidden;flex-wrap:wrap}
  .seg button{border:0;background:#fff;padding:6px 12px;font:inherit;font-size:.86rem;font-weight:700;cursor:pointer}
  .seg button.an{background:var(--lapis);color:#fff}
  .meldung{background:var(--safran-hell);border:1px solid #e6d3ad;border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:700}
  /* Lektionsauswahl */
  .lk-bereich{border:1px solid var(--linie);border-radius:12px;margin:8px 0;background:#fff}
  .lk-bereich summary{padding:10px 14px;font-weight:800;cursor:pointer;display:flex;gap:8px;align-items:center}
  .lk-bereich summary .anz{margin-left:auto;font-size:.8rem;color:var(--tinte2)}
  .lk-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px;padding:4px 14px 12px}
  .lk-liste label{display:flex;gap:8px;align-items:center;font-size:.9rem;padding:3px 0;cursor:pointer}
  .lk-liste label.zu{color:var(--tinte2)}
  /* Karten */
  .karten{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .wk{border:1.5px solid var(--linie);background:#fff;border-radius:14px;padding:10px 14px;min-width:110px;text-align:center;font:inherit;cursor:pointer;box-shadow:0 2px 0 var(--linie);transition:transform .1s}
  .wk:hover:not(:disabled){transform:translateY(-2px);border-color:var(--lapis)}
  .wk:disabled{cursor:default}
  .wk .fa{font-size:1.45rem;line-height:1.8;display:block}
  .wk .tr{font-size:.8rem;color:var(--tinte2);font-style:italic;display:block}
  .wk .de{font-size:.95rem;font-weight:700;display:block}
  .wk .em{font-size:1.2rem;display:block}
  .wk.ok{border-color:var(--gruen);background:var(--gruen-hell)}
  .wk.falsch{border-color:var(--granat);background:var(--granat-hell)}
  .wk.weg{opacity:.35}
  .wk.wahl{border-color:var(--tinte);box-shadow:0 0 0 2px var(--tinte)}
  .mitte{border:2px dashed #b9c9c6;border-radius:20px;padding:16px;background:#f7faf9;text-align:center;min-height:120px}
  .kat-karte{display:inline-block;background:var(--lapis);color:#fff;border-radius:16px;padding:14px 22px;box-shadow:0 3px 0 #1f4246}
  .kat-karte .fa{font-size:1.5rem;display:block;line-height:1.8}
  .kat-karte b{font-size:1.25rem}
  .kat-wahl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .kat-wahl button{border:0;cursor:pointer;font:inherit}
  .wurf{font-size:2.2rem;font-weight:800;text-align:center;margin:6px 0}
  .wurf.fa{font-size:2.6rem;line-height:1.9}
  .pkt{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .pkt span{background:#fff;border:1px solid var(--linie);border-radius:999px;padding:3px 10px;font-size:.84rem;font-weight:700}
  .pkt span.dran{border-color:var(--safran);box-shadow:0 0 0 2px var(--safran-hell)}
  .tische{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .tisch h3{margin:0 0 6px}
  .status{font-size:.9rem;color:var(--tinte2)}
  .tn-zeile{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tn-zeile span{background:#fff;border:1px solid var(--linie);border-radius:999px;padding:5px 12px;font-weight:800}
  .tn-zeile button{border:0;background:none;color:var(--tinte2);cursor:pointer}
  .ueben{display:flex;flex-wrap:wrap;gap:6px}
  .ueben span{background:#fff;border:1px solid var(--linie);border-radius:10px;padding:4px 10px}
  .ueben .fa{font-size:1.15rem}
  .regel{background:var(--lapis-hell);border:1px solid #cddcd9;border-radius:12px;padding:10px 14px;margin:10px 0}
  body.ohne-tr .wk .tr{display:none}
</style>
</head>
<body>
<header class="kopf">
  <div class="wrap">
    <a href="aktivitaeten.html" class="medaillon" style="text-decoration:none">فا</a>
    <div><h1 id="kopfTitel">Vokabelspiele</h1><div class="unter">Aktivität · Farsi-Lernpfad</div></div>
    <div class="rechts"><span class="kopf-btn" id="kopfInfo" style="background:transparent;border-color:transparent"></span><a class="kopf-btn" href="aktivitaeten.html">← Aktivitäten</a></div>
  </div>
</header>
<main class="wrap" style="padding-bottom:60px"><div id="app"><p class="muted" style="margin-top:30px">Lade …</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/core.js"></script>
<script src="assets/live-tools.js"></script>
<script>
/* ===================== Logik (rein, auch für Tests) ===================== */
window.VOKABEL_ENGINE = (function () {
  /* Kategorien: was als Karte in die Mitte darf (+ persischer Name) */
  const KATEGORIEN = {
    "Menschen & Familie": "آدَم‌ها و خانِواده", "Essen & Trinken": "خوردَنی و نوشیدَنی", "Orte": "جاها", "Zeit": "زَمان",
    "Natur & Wetter": "طَبیعَت و هَوا", "Berufe": "شُغل‌ها", "Gefühle & Zustände": "اِحساس‌ها", "Körper": "بَدَن",
    "Tiere": "حِیوان‌ها", "Zahlen": "عَدَدها", "Verben": "فِعل‌ها", "Eigenschaften": "صِفَت‌ها"
  };
  const KAT_ICON = { "Menschen & Familie": "👨‍👩‍👧", "Essen & Trinken": "🍲", "Orte": "📍", "Zeit": "🕒", "Natur & Wetter": "🌦️", "Berufe": "🧑‍🔧", "Gefühle & Zustände": "💭", "Körper": "🖐️", "Tiere": "🐈", "Zahlen": "🔢", "Verben": "🏃", "Eigenschaften": "✨" };
  const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  function rng(seed) { let a = typeof seed === "number" ? seed : hash(seed); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function mischen(a, r) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  /* daten: [{id, woerter:[...]}] → Pool mit stabilen Schlüsseln „lek:index“ */
  function pool(daten) {
    const W = {}, keys = [], byKat = {}, gesehenFa = new Set(), gesehenDe = new Set();
    daten.forEach(d => (d.woerter || []).forEach((w, i) => {
      if (!w || !w.fa || !w.de) return;
      const fa0 = w.fa.replace(/[ً-ْ]/g, ""), de0 = w.de.toLowerCase();
      if (gesehenFa.has(fa0) || gesehenDe.has(de0)) return;
      gesehenFa.add(fa0); gesehenDe.add(de0);
      const k = d.id + ":" + i; W[k] = w; keys.push(k);
      (byKat[w.kat] = byKat[w.kat] || []).push(k);
    }));
    const karteKats = Object.keys(byKat).filter(k => KATEGORIEN[k] && byKat[k].length >= 3);
    const karteKeys = keys.filter(k => karteKats.includes(W[k].kat));
    return { W, keys, byKat, karteKats, karteKeys };
  }
  /* --- Spiel 1: Wort-Duell --- */
  const duellHand = (P, seed, n = 5) => mischen(P.keys, rng(seed)).slice(0, n);
  function optionen(P, key, n, seed) {
    const r = rng(seed), w = P.W[key];
    const gleich = mischen((P.byKat[w.kat] || []).filter(k => k !== key), r);
    const rest = mischen(P.keys.filter(k => k !== key && P.W[k].kat !== w.kat), r);
    const wahl = [key];
    for (const k of gleich.slice(0, Math.ceil((n - 1) / 2)).concat(rest, gleich.slice(Math.ceil((n - 1) / 2)))) {
      if (wahl.length >= n) break;
      if (!wahl.includes(k)) wahl.push(k);
    }
    return mischen(wahl, r);
  }
  const richtungFuer = zug => Math.floor(zug / 1) % 2 === 0 ? "de" : "fa";   /* abwechselnd: Deutsch → Persisch, dann andersrum */
  /* --- Spiel 2: Karte in die Mitte --- */
  function karteHand(P, seed, n = 8, ohne = []) {
    const r = rng(seed), kats = mischen(P.karteKats, r), hand = [];
    /* aus mehreren Kategorien mischen, damit fast jede Karte in der Mitte jemandem etwas bringt */
    let i = 0, schutz = 0;
    while (hand.length < n && schutz++ < 400) {
      const kat = kats[i++ % kats.length], kandid = P.byKat[kat].filter(k => !hand.includes(k) && !ohne.includes(k));
      if (kandid.length) hand.push(kandid[Math.floor(r() * kandid.length)]);
    }
    return hand;
  }
  function katVorschlaege(P, haende, seed, n = 3) {
    const z = {}; haende.forEach(h => h.forEach(k => { const kat = P.W[k] && P.W[k].kat; if (P.karteKats.includes(kat)) z[kat] = (z[kat] || 0) + 1; }));
    const r = rng(seed);
    const gut = mischen(Object.keys(z).filter(k => z[k] >= 2), r);
    const rest = mischen(P.karteKats.filter(k => !gut.includes(k)), r);
    return gut.concat(rest).slice(0, n);
  }
  const liste = s => String(s || "").split("|").filter(Boolean);
  return { KATEGORIEN, KAT_ICON, hash, rng, mischen, pool, duellHand, optionen, richtungFuer, karteHand, katVorschlaege, liste };
})();

/* ===================== Seite ===================== */
(function () {
  const F = window.FARSI, { $, $$, esc, toast } = F, E = window.VOKABEL_ENGINE, LT = window.LIVE_TOOLS;
  const qs = new URLSearchParams(location.search);
  const SPIELE = {
    duell: { titel: "Wort-Duell", icon: "🎯", text: "Eine Person wirft ein Wort in die Runde – die anderen finden unter mehreren Wörtern die Übersetzung. Dann ist die nächste Person dran, und die Richtung wechselt: einmal Deutsch → Persisch, einmal Persisch → Deutsch." },
    karte: { titel: "Karte in die Mitte", icon: "🃏", text: "Eine Person legt eine Themenkarte in die Mitte (z. B. „Familie“). Alle werfen so schnell wie möglich passende Wörter aus ihrer Hand dazu – richtig +1, falsch −1." }
  };
  const MODUS = qs.get("leitung") ? "leitung" : "spieler";
  const istLK = MODUS === "leitung";
  let SPIEL = qs.get("spiel") === "karte" ? "karte" : "duell";
  let CODE = (qs.get("code") || "").replace(/\D/g, "") || null;
  let G = null, REF = null, ME = null, P = null, POOL_LEKS = "", INDEX = null, TISCH_ANSICHT = null;
  const app = () => $("#app");
  const gRef = c => F.ref(`live/vokabel/${c}`);
  const SP = () => Object.entries((G && G.spieler) || {}).filter(([, s]) => s && s.name);
  const name = id => ((G && G.spieler && G.spieler[id]) || {}).name || "?";
  const online = id => ((G.spieler || {})[id] || {}).online !== false;
  const istHost = () => !!(G && ME && G.host === ME.id);
  const darfLeiten = () => istLK || istHost();

  function fehler(e, hart) {
    console.error(e);
    if (!hart) { toast("Das hat nicht geklappt – bitte noch einmal tippen."); return; }
    app().innerHTML = `<div class="karte" style="margin-top:20px"><b>Das hat nicht geklappt.</b><p class="klein muted">${esc(e && e.message || e)}</p><p class="klein">Bitte neu laden. Lehrkraft: Sind die Regeln aus <code>firebase-regeln.json</code> veröffentlicht?</p></div>`;
  }
  const upd = o => gRef(CODE).update(o).catch(e => fehler(e));

  /* ---------- Wortschatz laden ---------- */
  async function index() { return INDEX || (INDEX = await F.ladeJSON("lektionen/index.json")); }
  async function ladePool(leks) {
    if (P && POOL_LEKS === leks) return P;
    const ix = await index(), ids = String(leks).split(",").filter(Boolean);
    const daten = await Promise.all(ids.map(async id => { const l = ix.lektionen.find(x => x.id === id); if (!l || !l.wortschatz) return { id, woerter: [] };
      try { const d = await F.ladeJSON("lektionen/" + l.wortschatz); return { id, woerter: d.woerter }; } catch (e) { return { id, woerter: [] }; } }));
    P = E.pool(daten); POOL_LEKS = leks; return P;
  }
  function hoere(c) {
    if (REF) REF.off();
    REF = gRef(c);
    REF.on("value", async s => {
      G = s.val();
      if (G && G.spiel) SPIEL = G.spiel;
      if (MODUS !== "leitung") LT.pruefeNeuLaden(G);
      if (G && G.leks && POOL_LEKS !== G.leks) { try { await ladePool(G.leks); } catch (e) { return fehler(e, true); } }
      if (darfLeiten()) nachzuegler();
      if (LT.tipptGerade(zeichne)) return;
      zeichne();
    }, e => fehler(e, true));
  }

  /* ---------- Darstellung eines Worts ---------- */
  const ohneHilfe = () => !!(G && G.stufe === "ohne");
  const ohneTr = () => !!(G && (G.umschrift === false || G.stufe === "ohne"));
  /* freie Antwort (Deutsch) tolerant prüfen: Artikel, Klammern, Groß/klein, Umlaute, 1 Tippfehler */
  const normDe = x => String(x || "").toLowerCase().replace(/\(.*?\)/g, " ").replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim().replace(/^((der|die|das|den|dem|ein|eine|einen|zu|sich)\s+)+/, "");
  function lev(a, b) { const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }
  function deRichtig(eingabe, de) {
    const e = normDe(eingabe); if (!e) return false;
    const varianten = String(de).split(/[\/,;]| oder /).map(normDe).filter(Boolean).concat([normDe(de)]);
    /* „Lehrer/in“ → auch „lehrerin“ */
    String(de).split(/[,;]/).forEach(t => { const m = t.match(/^(.*?)\/(in|innen)$/i); if (m) varianten.push(normDe(m[1] + m[2]), normDe(m[1])); });
    return varianten.some(v => v === e || (v.length >= 5 && lev(v, e) <= 1));
  }
  function wort(k, zeig, extra = "", attr = "") {
    const w = P.W[k]; if (!w) return "";
    const z = Object.assign({ fa: true, tr: true, de: true, em: false }, zeig);
    return `<button class="wk ${extra}" ${attr}>${z.em && w.emoji ? `<span class="em">${w.emoji}</span>` : ""}${z.fa ? `<span class="fa">${esc(w.fa)}</span>` : ""}${z.fa && z.tr && w.tr && !ohneTr() ? `<span class="tr">${esc(w.tr)}</span>` : ""}${z.de ? `<span class="de">${esc(w.de)}</span>` : ""}</button>`;
  }
  function katKarte(kat, attr = "") {
    return `<button class="kat-karte" ${attr}><span style="font-size:1.6rem">${E.KAT_ICON[kat] || "🃏"}</span><span class="fa">${esc(E.KATEGORIEN[kat] || "")}</span>${ohneHilfe() ? "" : `<b>${esc(kat)}</b>`}</button>`;
  }
  function punkteHtml(t, dran) {
    const p = t.punkte || {};
    return `<div class="pkt">${E.liste(t.sp).map(id => `<span class="${dran === id ? "dran" : ""}" style="${online(id) ? "" : "opacity:.5"}">${esc(name(id))} · ${p[id] || 0}</span>`).join("")}</div>`;
  }

  /* =====================================================================
     Tisch-Logik (beide Spiele)
     ===================================================================== */
  const arrV = v => Array.isArray(v) ? v.filter(Boolean) : v && typeof v === "object" ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]) : [];
  const T = id => (G.teams || {})[id];
  const tRef = id => gRef(CODE).child("teams/" + id);
  const meinTisch = () => { const s = (G.spieler || {})[ME.id]; return s && s.tisch; };
  const seedT = (tid, x) => CODE + "|" + tid + "|" + x;
  function tischNeu(sp, tid) {
    const t = { sp: sp.join("|"), zug: 0, punkte: {}, phase: SPIEL === "karte" ? "legen" : "werfen" };
    if (SPIEL === "karte") { t.haende = {}; let alle = []; sp.forEach(id => { const h = E.karteHand(P, seedT(tid, id + "|0"), 8, alle); alle = alle.concat(h); t.haende[id] = h.join("|"); }); }
    return t;
  }
  /* Tische bilden: Größe g, ein einzelner Rest kommt zum letzten Tisch */
  function tischeBilden(ids, g) {
    ids = E.mischen(ids, E.rng(Date.now()));
    const n = Math.max(1, Math.floor(ids.length / g)), tische = Array.from({ length: n }, () => []);
    ids.forEach((id, i) => tische[i % n].push(id));
    return tische;
  }
  /* Wer nach dem Start kommt, setzt sich an den kleinsten Tisch (macht die Lehrkraft-/Host-Seite) */
  let nachzueglerLaeuft = false;
  async function nachzuegler() {
    if (nachzueglerLaeuft || !G || G.phase !== "spiel" || !P) return;
    const ohne = SP().filter(([, s]) => !s.tisch && !s.aus);
    if (!ohne.length) return;
    nachzueglerLaeuft = true;
    try {
      for (const [id] of ohne) {
        const ts = Object.entries(G.teams || {}).sort(([, a], [, b]) => E.liste(a.sp).length - E.liste(b.sp).length);
        if (!ts.length) break;
        const [tid] = ts[0];
        await tRef(tid).transaction(t => { if (!t) return t; const l = E.liste(t.sp); if (l.includes(id)) return t; l.push(id); t.sp = l.join("|");
          if (SPIEL === "karte") { t.haende = t.haende || {}; t.haende[id] = E.karteHand(P, seedT(tid, id + "|" + (t.zug || 0)), 8).join("|"); } return t; });
        await gRef(CODE).child(`spieler/${id}/tisch`).set(tid);
      }
    } catch (e) { console.error(e); }
    nachzueglerLaeuft = false;
  }

  /* ---------- Spiel 1: Wort-Duell ---------- */
  function duellZustand(t) {
    const sp = E.liste(t.sp), zug = t.zug || 0, werfer = sp.length ? sp[zug % sp.length] : null;
    const w = t.wurf || null, ri = E.richtungFuer(zug);
    const antworter = sp.filter(id => id !== werfer && online(id));
    const antw = (w && w.antw) || {};
    const fertig = !!w && (w.auf || (antworter.length > 0 && antworter.every(id => antw[id] != null)));
    return { sp, zug, werfer, w, ri, antw, fertig, antworter };
  }
  function duellHtml(tid, t, ich, nurSehen) {
    const Z = duellZustand(t), opts = (G.optionen || 4);
    let h = punkteHtml(t, Z.werfer);
    if (!Z.w) {
      if (ich === Z.werfer) {
        const hand = E.duellHand(P, seedT(tid, Z.zug));
        h += `<div class="karte"><h3 style="margin-top:0">🎯 Du bist dran: Wirf ein Wort!</h3><p class="klein muted">Runde ${Z.zug + 1} · ${Z.ri === "de" ? "Die anderen sehen das <b>deutsche</b> Wort und suchen das persische." : "Die anderen sehen das <b>persische</b> Wort und suchen das deutsche."}</p>
          <div class="karten">${hand.map(k => wort(k, ohneHilfe() ? (Z.ri === "de" ? { fa: false, de: true } : { fa: true, tr: false, de: false }) : { em: true }, "", nurSehen ? "disabled" : `data-wirf="${k}"`)).join("")}</div></div>`;
      } else h += `<div class="karte" style="text-align:center"><p style="font-size:1.15rem">⏳ <b>${esc(name(Z.werfer))}</b> sucht ein Wort aus …</p><p class="klein muted">Runde ${Z.zug + 1} · ${Z.ri === "de" ? "Deutsch → Persisch" : "Persisch → Deutsch"}</p></div>`;
      return h;
    }
    const k = Z.w.k, wo = P.W[k], liste = Z.w.opts ? String(Z.w.opts).split("|") : E.optionen(P, k, opts, seedT(tid, "o" + Z.zug));
    const quelle = Z.ri === "de" ? `<div class="wurf">${esc(wo.de)}</div>` : `<div class="wurf fa">${esc(wo.fa)}</div>${wo.tr && !ohneTr() && G.stufe !== "schwer" ? `<div style="text-align:center" class="muted">${esc(wo.tr)}</div>` : ""}`;
    const zeig = Z.ri === "de" ? { fa: true, tr: G.stufe !== "schwer", de: false } : { fa: false, tr: false, de: true };
    const meine = Z.antw[ich], frei = ohneHilfe() && Z.ri === "fa";

  async function duellWerfen(tid, k) {

    await tRef(tid).transaction(x => { if (!x) return x; if (x.wurf || (x.zug || 0) !== Z.zug) return; x.wurf = { k, opts, von: ME.id }; return x; }).catch(e => fehler(e));
  }
  async function duellAntwort(tid, i) {
    const Z = duellZustand(T(tid));
    await tRef(tid).transaction(x => { if (!x || !x.wurf || (x.zug || 0) !== Z.zug) return x ? undefined : x; x.wurf.antw = x.wurf.antw || {}; if (x.wurf.antw[ME.id] != null) return; x.wurf.antw[ME.id] = i; return x; }).catch(e => fehler(e));
  }
  async function duellWeiter(tid) {
    const Z0 = duellZustand(T(tid));
    await tRef(tid).transaction(x => {
      if (!x || (x.zug || 0) !== Z0.zug || !x.wurf) return x ? undefined : x;
      const liste = String(x.wurf.opts).split("|"), k = x.wurf.k, sp = E.liste(x.sp), werfer = sp[(x.zug || 0) % sp.length];
      x.punkte = x.punkte || {}; const log = arrV(x.log);
      Object.entries(x.wurf.antw || {}).forEach(([id, a]) => { const ok = typeof a === "string" ? a[0] === "+" : liste[a] === k; if (ok) x.punkte[id] = (x.punkte[id] || 0) + 1; log.push({ p: id, k, ok }); });
      x.log = log.slice(-300); x.wurf = null; x.zug = (x.zug || 0) + 1; return x;
    }).catch(e => fehler(e));
  }

  /* ---------- Spiel 2: Karte in die Mitte ---------- */
  function karteZustand(t, tid) {
    const sp = E.liste(t.sp), zug = t.zug || 0, leger = sp.length ? sp[zug % sp.length] : null;
    const haende = {}; sp.forEach(id => { haende[id] = E.liste((t.haende || {})[id]); });
    const m = t.mitte || null, gelegt = m && Array.isArray(m.gelegt) ? m.gelegt.filter(Boolean) : m && m.gelegt ? Object.values(m.gelegt) : [];
    const offen = m ? sp.filter(id => online(id)).reduce((n, id) => n + haende[id].filter(k => P.W[k] && P.W[k].kat === m.kat).length, 0) : 0;
    const fertigAlle = m && sp.filter(id => online(id)).every(id => (m.fertig || {})[id]);
    const ende = !!m && (m.aus || offen === 0 || fertigAlle);
    return { sp, zug, leger, haende, m, gelegt, offen, ende };
  }
  function karteHtml(tid, t, ich, nurSehen) {
    const Z = karteZustand(t, tid), meineHand = Z.haende[ich] || [], zeigDe = G.stufe !== "schwer" && G.stufe !== "ohne";
    let h = punkteHtml(t, Z.leger);
    if (!Z.m) {
      if (ich === Z.leger) {
        const v = E.katVorschlaege(P, Object.values(Z.haende), seedT(tid, "k" + Z.zug));
        h += `<div class="karte" style="text-align:center"><h3 style="margin-top:0">🃏 Du bist dran: Lege eine Themenkarte in die Mitte!</h3><div class="kat-wahl">${v.map(kat => katKarte(kat, nurSehen ? "disabled" : `data-lege="${tid}|${esc(kat)}"`)).join("")}</div></div>`;
      } else h += `<div class="karte mitte"><p style="font-size:1.15rem">⏳ <b>${esc(name(Z.leger))}</b> legt gleich eine Karte in die Mitte …</p></div>`;
      h += `<div class="klein-h">Deine Hand</div><div class="karten">${meineHand.map(k => wort(k, { de: zeigDe }, "", "disabled")).join("")}</div>`;
      return h;
    }
    h += `<div class="mitte">${katKarte(Z.m.kat, "disabled")}<div class="karten" style="margin-top:12px">${Z.gelegt.map(g => `<div>${wort(g.k, { de: true }, g.ok ? "ok" : "falsch", "disabled")}<div class="klein">${esc(name(g.p))} ${g.ok ? "+1" : "−1"}</div></div>`).join("") || `<span class="muted">Noch nichts geworfen – los geht's!</span>`}</div></div>`;
    if (Z.ende) {
      const verpasst = Z.sp.flatMap(id => Z.haende[id].filter(k => P.W[k] && P.W[k].kat === Z.m.kat));
      h += `<div class="regel" style="text-align:center"><b>Runde vorbei!</b> ${verpasst.length ? `Hätte auch gepasst: ${verpasst.map(k => `<span class="fa">${esc(P.W[k].fa)}</span> (${esc(P.W[k].de)})`).join(" · ")}` : "Alle passenden Wörter liegen in der Mitte. 👏"}</div>`;
      if (!nurSehen && (ich === Z.leger || darfLeiten() || !online(Z.leger))) h += `<div class="btnreihe" style="justify-content:center"><button class="btn" data-naechste="${tid}">Nächste Karte ➜ ${esc(name(Z.sp[(Z.zug + 1) % Z.sp.length]))} legt</button></div>`;
      else h += `<p class="muted" style="text-align:center">⏳ ${esc(name(Z.leger))} macht weiter …</p>`;
      return h;
    }
    const istFertig = (Z.m.fertig || {})[ich];
    h += `<div class="klein-h">Deine Hand – tippe auf alles, was zu ${ohneHilfe() ? "dieser Karte" : "„" + esc(Z.m.kat) + "“"} passt</div><div class="karten">${meineHand.map(k => wort(k, { de: zeigDe }, "", nurSehen || istFertig ? "disabled" : `data-werfe="${tid}|${k}"`)).join("") || `<span class="muted">Keine Karten mehr.</span>`}</div>
      ${nurSehen ? "" : `<div class="btnreihe" style="justify-content:center;margin-top:12px">${istFertig ? `<span class="muted">✔ Du hast „fertig“ gesagt – warte auf die anderen …</span>` : `<button class="btn zwei" data-fertig="${tid}">✋ Ich habe nichts Passendes mehr</button>`}${ich === Z.leger || darfLeiten() ? `<button class="btn zwei klein" data-aus="${tid}">⏹ Runde beenden</button>` : ""}</div>`}`;
    return h;
  }
  async function karteLegen(tid, kat) {
    const z = T(tid).zug || 0;
    await tRef(tid).transaction(x => { if (!x || x.mitte || (x.zug || 0) !== z) return x ? undefined : x; x.mitte = { kat, von: ME.id }; return x; }).catch(e => fehler(e));
  }
  async function karteWerfen(tid, k) {
    let ergebnis = null;
    await tRef(tid).transaction(x => {
      if (!x || !x.mitte) return x ? undefined : x;
      const hand = E.liste((x.haende || {})[ME.id]); if (!hand.includes(k)) return;
      const ok = P.W[k] && P.W[k].kat === x.mitte.kat;
      x.haende[ME.id] = hand.filter(y => y !== k).join("|") || null;
      const g = Array.isArray(x.mitte.gelegt) ? x.mitte.gelegt.filter(Boolean) : Object.values(x.mitte.gelegt || {});
      g.push({ p: ME.id, k, ok }); x.mitte.gelegt = g;
      x.punkte = x.punkte || {}; x.punkte[ME.id] = (x.punkte[ME.id] || 0) + (ok ? 1 : -1);
      const log = arrV(x.log); log.push({ p: ME.id, k, ok }); x.log = log.slice(-300);
      ergebnis = { ok, kat: P.W[k] && P.W[k].kat }; return x;
    }).catch(e => fehler(e));
    if (ergebnis && !ergebnis.ok) toast(`Passt nicht – das gehört zu „${ergebnis.kat}${E.KATEGORIEN[ergebnis.kat] ? " · " + E.KATEGORIEN[ergebnis.kat] : ""}“. −1`);
  }
  async function karteNaechste(tid) {
    const Z0 = karteZustand(T(tid), tid);
    await tRef(tid).transaction(x => {
      if (!x || (x.zug || 0) !== Z0.zug || !x.mitte) return x ? undefined : x;
      const sp = E.liste(x.sp), zug = (x.zug || 0) + 1, log = arrV(x.log);
      x.haende = x.haende || {};
      sp.forEach(id => { const h = E.liste(x.haende[id]);
        h.filter(k => P.W[k] && P.W[k].kat === x.mitte.kat).forEach(k => log.push({ p: id, k, ok: false, verpasst: true }));
        const neu = E.karteHand(P, seedT(tid, id + "|" + zug), 8 - h.length, h); x.haende[id] = h.concat(neu).slice(0, 8).join("|"); });
      x.log = log.slice(-300); x.mitte = null; x.zug = zug; return x;
    }).catch(e => fehler(e));
  }

  function verdrahteTisch() {

    $$("[data-antw]").forEach(b => b.onclick = () => { $$("[data-antw]").forEach(x => x.disabled = true); const [tid, i] = b.dataset.antw.split("|"); duellAntwort(tid, +i); });

    $$("[data-naechste]").forEach(b => b.onclick = () => { b.disabled = true; karteNaechste(b.dataset.naechste); });
  }
  const tischHtml = (tid, t, ich, nurSehen) => SPIEL === "karte" ? karteHtml(tid, t, ich, nurSehen) : duellHtml(tid, t, ich, nurSehen);

  /* ---------- Auswertung am Ende ---------- */
  function rangliste() {

    return SP().map(([id, s]) => ({ id, name: s.name, p: p[id] || 0 })).sort((a, b) => b.p - a.p);
  }

  }

  /* =====================================================================
     Einrichten: Spiel, Lektionen, Stufe (Lehrkraft oder Host)

  let AUSWAHL = new Set((qs.get("leks") || "").split(",").filter(Boolean));

      <div class="btnreihe" style="margin-top:14px"><button class="btn" id="anlegen">▶ Runde anlegen</button></div><p class="klein" id="poolInfo" style="color:var(--granat)"></p></div>`;

  }
  function lobbyEinstellungen() {

    return `<div class="karte"><h2 style="margin-top:0">${s.icon} ${esc(s.titel)}</h2><p class="klein muted">${P ? P.keys.length : "?"} Wörter aus ${String(G.leks).split(",").length} Lektion(en)${SPIEL === "karte" && P ? ` · ${P.karteKats.length} Themen` : ""}</p>
      <div style="display:flex;gap:18px;flex-wrap:wrap">
        <div><div class="klein-h">Stufe</div><div class="seg"><button class="${!G.stufe || G.stufe === "leicht" ? "an" : ""}" data-set="stufe|leicht">${SPIEL === "karte" ? "leicht · mit deutscher Bedeutung" : "leicht · mit Umschrift"}</button><button class="${G.stufe === "schwer" ? "an" : ""}" data-set="stufe|schwer">${SPIEL === "karte" ? "schwer · nur Persisch" : "schwer · ohne Umschrift"}</button><button class="${G.stufe === "ohne" ? "an" : ""}" data-set="stufe|ohne">${SPIEL === "karte" ? "ohne Hilfe · nur persische Schrift" : "ohne Hilfe · Antwort selbst schreiben"}</button></div>
          <p class="klein muted" style="margin:6px 0 0;max-width:520px">${G.stufe === "ohne" ? (SPIEL === "karte" ? "Keine Umschrift, keine deutsche Bedeutung, die Themenkarte nur auf Persisch." : "Keine Umschrift, keine Bilder. Persisch → Deutsch: Antwort wird getippt (Artikel und kleine Tippfehler sind egal). Deutsch → Persisch: Auswahl ohne Umschrift.") : ""}</p></div>
        ${SPIEL === "duell" ? `<div><div class="klein-h">Antworten zur Auswahl</div><div class="seg">${[3, 4, 6].map(n => `<button class="${(G.optionen || 4) === n ? "an" : ""}" data-set="optionen|${n}">${n}</button>`).join("")}</div></div>` : ""}
        ${G.stufe === "ohne" ? "" : `<div><div class="klein-h">Umschrift</div><div class="seg"><button class="${ohneTr() ? "" : "an"}" data-set="umschrift|an">an</button><button class="${ohneTr() ? "an" : ""}" data-set="umschrift|aus">aus</button></div></div>`}
        ${istLK ? `<div><div class="klein-h">Personen pro Tisch</div><div class="seg">${[2, 3, 4, 6].map(n => `<button class="${(G.groesse || 2) === n ? "an" : ""}" data-set="groesse|${n}">${n}</button>`).join("")}</div></div>` : ""}
      </div></div>`;
  }
  function verdrahteEinstellungen() {
    $$("[data-set]").forEach(b => b.onclick = () => { const [k, v] = b.dataset.set.split("|"); upd({ [k]: k === "umschrift" ? (v === "an" ? null : false) : /^\d+$/.test(v) ? +v : v }); });
    $$("[data-weg]").forEach(b => b.onclick = () => gRef(CODE).child("spieler/" + b.dataset.weg).set(null).catch(e => fehler(e)));
  }
  async function starten() {
    if (!P) await ladePool(G.leks);
    const ids = SP().map(([id]) => id);
    const tische = istLK ? tischeBilden(ids, G.groesse || 2) : [ids];
    const o = { phase: "spiel", start: Date.now(), teams: {} };
    tische.forEach((sp, i) => { const tid = "t" + (i + 1); o.teams[tid] = tischNeu(sp, tid); sp.forEach(id => { o[`spieler/${id}/tisch`] = tid; }); });
    const teams = o.teams; delete o.teams; tische.forEach((sp, i) => { o["teams/t" + (i + 1)] = teams["t" + (i + 1)]; });
    await upd(o);
  }

  /* =====================================================================
     LEITUNG
     ===================================================================== */
  function startLeitung() {
    firebase.auth().onAuthStateChanged(u => {
      if (!u) { app().innerHTML = `<div class="karte" style="margin-top:20px"><h2>Nur für Lehrkräfte</h2><p>Bitte zuerst in der <a href="konsole.html">Konsole</a> anmelden.</p></div>`; return; }
      LT.verbindung(null);
      if (CODE) hoere(CODE); else zeichneEinrichten().catch(e => fehler(e, true));
    });
  }
  function zeichneLeitung() {
    if (!G) { app().innerHTML = `<div class="karte" style="margin-top:20px">Diese Runde gibt es nicht (mehr). <a href="?leitung=1">Neue Runde</a></div>`; return; }
    if (!P) return;
    $("#kopfTitel").textContent = SPIELE[SPIEL].titel;
    const sp = SP();
    let h = `<div class="vk-kopf"><div><div class="klein muted">Spielcode</div><div class="vk-code">${CODE}</div></div><div class="btnreihe">
      ${G.phase === "lobby" ? `<button class="btn" id="start" ${sp.length >= 2 ? "" : "disabled"}>▶ Spiel starten</button>` : ""}
      ${G.phase === "spiel" ? `<button class="btn rot klein" id="ende">⏹ beenden</button>` : ""}</div></div>`;
    h += (G.nachricht ? `<div class="meldung">📢 ${esc(G.nachricht.text)}</div>` : "") + LT.timerHtml(G);
    if (G.phase === "lobby") {
      h += lobbyEinstellungen() + `<div class="karte" style="margin-top:12px"><p>Die Teilnehmenden öffnen <b>🎲 Aktivitäten</b> (oder <b>live-vokabel.html</b>) und geben den Code <b>${CODE}</b> ein. Beim Start werden Tische zu je ${G.groesse || 2} Personen gebildet; wer später kommt, setzt sich an den kleinsten Tisch.</p>
        <h3>Dabei (${sp.length})</h3><div class="tn-zeile">${sp.map(([id, s]) => `<span>${esc(s.name)} <button data-weg="${id}">✕</button></span>`).join("") || `<span class="muted" style="border:0">Noch niemand da …</span>`}</div></div>`;
    } else if (G.phase === "ende") {
      h += endeHtml(null) + `<div class="btnreihe" style="margin-top:12px"><a class="btn zwei" href="?leitung=1" style="text-decoration:none">Neue Runde</a></div>`;
    } else if (TISCH_ANSICHT && T(TISCH_ANSICHT)) {
      const t = T(TISCH_ANSICHT), l = E.liste(t.sp);
      h += `<div class="btnreihe"><button class="btn zwei klein" id="zurueck">← alle Tische</button></div><h3>👀 ${esc(TISCH_ANSICHT.replace("t", "Tisch "))}: ${l.map(name).map(esc).join(", ")}</h3>
        <div class="tische">${l.map(id => `<div><div class="schau-kopf">${online(id) ? "🟢" : "⚪"} ${esc(name(id))}</div><div class="schau">${tischHtml(TISCH_ANSICHT, t, id, true)}</div></div>`).join("")}</div>`;
    } else {
      h += `<div class="tische">${Object.entries(G.teams || {}).map(([tid, t]) => {
        const l = E.liste(t.sp); let st;
        if (SPIEL === "duell") { const Z = duellZustand(t); st = !Z.w ? `🎯 ${esc(name(Z.werfer))} wählt ein Wort` : Z.fertig ? `✅ aufgelöst: ${esc(P.W[Z.w.k].de)}` : `⏳ ${Object.keys(Z.antw).length}/${Z.antworter.length} geantwortet · „${esc(P.W[Z.w.k].de)}“`; }
        else { const Z = karteZustand(t, tid); st = !Z.m ? `🃏 ${esc(name(Z.leger))} legt eine Karte` : Z.ende ? `✅ Runde vorbei (${esc(Z.m.kat)})` : `🃏 ${esc(Z.m.kat)} · ${Z.gelegt.length} geworfen, noch ${Z.offen} passend`; }
        return `<div class="karte tisch"><h3>${esc(tid.replace("t", "Tisch "))}</h3><p class="status">Runde ${(t.zug || 0) + 1} · ${st}</p>${punkteHtml(t)}<div class="btnreihe"><button class="btn zwei klein" data-schau="${tid}">👀 Bildschirme ansehen</button></div></div>`; }).join("")}</div>
        <div class="karte" style="margin-top:12px"><div class="klein-h" style="margin-top:0">Werkzeuge</div>${LT.timerSteuerung(G)}
        <div class="lt-werkzeug"><input class="feld" id="msg" placeholder="Nachricht an alle …" style="flex:1;min-width:160px;padding:6px 10px"><button class="btn zwei klein" id="senden">📢 senden</button>${G.nachricht ? `<button class="btn zwei klein" id="msgweg">✕</button>` : ""}<button class="btn zwei klein" id="reload">🔄 Alle Geräte neu laden</button></div></div>`;
    }
    LT.render(app(), h); LT.nachRender();
    verdrahteEinstellungen(); verdrahteLeitung();
  }
  function verdrahteLeitung() {
    const b = id => $("#" + id);
    if (b("start")) b("start").onclick = () => { b("start").disabled = true; starten().catch(e => fehler(e)); };
    if (b("ende")) b("ende").onclick = () => { if (confirm("Spiel beenden und Ergebnis zeigen?")) upd({ phase: "ende" }); };
    if (b("zurueck")) b("zurueck").onclick = () => { TISCH_ANSICHT = null; zeichne(); };
    $$("[data-schau]").forEach(x => x.onclick = () => { TISCH_ANSICHT = x.dataset.schau; zeichne(); });
    $$("[data-lt-timer]").forEach(x => x.onclick = () => { const m = +x.dataset.ltTimer; upd({ timer: m ? { ende: Date.now() + m * 60000, text: m + " Minuten" } : null }); });
    if (b("senden")) b("senden").onclick = () => { const t = b("msg").value.trim(); if (t) { upd({ nachricht: { text: t, ts: Date.now() } }); b("msg").value = ""; } };
    if (b("msgweg")) b("msgweg").onclick = () => upd({ nachricht: null });
    if (b("reload")) b("reload").onclick = () => { if (confirm("Alle Geräte neu laden?")) upd({ reload: Date.now() }); };
  }

  /* =====================================================================
     SPIELER (mit Zugangscode oder nur mit Vornamen)
     ===================================================================== */
  function pid() {
    const s = F.sitzung(); if (s && s.code) return s.code;
    let p = null; try { p = localStorage.getItem("farsi_quiz_pid"); if (!p) { p = "q" + Math.random().toString(36).slice(2, 9); localStorage.setItem("farsi_quiz_pid", p); } } catch (e) { p = "q" + Math.random().toString(36).slice(2, 9); }
    return p;
  }
  function startSpieler() {
    const s = F.sitzung();
    let n = s && s.name; if (!n) try { n = localStorage.getItem("farsi_quiz_name") || ""; } catch (e) { n = ""; }
    ME = { id: pid(), name: n };
    if (qs.get("neu")) {
      if (!s) { app().innerHTML = `<div class="karte" style="margin-top:20px">Eine eigene Runde können nur Teilnehmende mit Zugangscode anlegen. <a href="index.html">Zur Anmeldung</a></div>`; return; }
      return zeichneEinrichten().catch(e => fehler(e, true));
    }
    if (CODE && s) beitreten(CODE, s.name); else zeichneBeitritt();
  }
  function zeichneBeitritt(meld) {
    app().innerHTML = `<div class="karte" style="margin-top:20px;max-width:480px;margin-inline:auto;text-align:center"><div style="font-size:3rem">🎲</div><h2 style="margin:0 0 6px">Vokabelspiele</h2>
      <p>Gib den <b>Spielcode</b> und deinen <b>Vornamen</b> ein.</p>
      <div style="display:grid;gap:10px;max-width:280px;margin:0 auto">
        <input class="feld" id="code" inputmode="numeric" maxlength="4" placeholder="Spielcode" value="${esc(CODE || "")}" style="text-align:center;font-size:1.4rem;letter-spacing:.2em">
        <input class="feld" id="name" maxlength="20" placeholder="Vorname" value="${esc(ME.name)}" style="text-align:center;font-size:1.15rem">
        <button class="btn" id="los">Mitspielen ➜</button></div>
      <p class="klein" style="color:var(--granat);min-height:1.2em">${meld || ""}</p></div>`;
    $("#los").onclick = () => beitreten($("#code").value.replace(/\D/g, ""), $("#name").value.trim());
    $$("#code,#name").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") $("#los").click(); }));
  }
  async function beitreten(c, n) {
    if (!/^\d{4}$/.test(c || "")) return zeichneBeitritt("Der Spielcode hat vier Ziffern.");
    if (!n) return zeichneBeitritt("Bitte gib deinen Vornamen ein.");
    n = n.split(/\s+/)[0].slice(0, 20);
    let g; try { g = (await F.mitTimeout(gRef(c).once("value"), 8000)).val(); } catch (e) { return fehler(e, true); }
    if (!g || !g.leks) { CODE = null; return zeichneBeitritt("Diesen Spielcode gibt es nicht."); }
    CODE = c; ME.name = n; try { localStorage.setItem("farsi_quiz_name", n); } catch (e) { }
    history.replaceState(null, "", "?code=" + c);
    try { if ((g.spieler || {})[ME.id]) await gRef(c).child(`spieler/${ME.id}/name`).set(n); else await gRef(c).child("spieler/" + ME.id).set({ name: n, ts: Date.now() }); } catch (e) { return fehler(e, true); }
    LT.verbindung(gRef(c).child("spieler/" + ME.id));
    hoere(c);
  }
  function zeichneSpieler() {
    if (!G) return zeichneBeitritt("Diese Runde wurde beendet.");
    if (!P) return;
    $("#kopfTitel").textContent = SPIELE[SPIEL].titel;
    const ich = (G.spieler || {})[ME.id];
    if (!ich) { app().innerHTML = `<div class="karte" style="margin-top:20px;text-align:center">Du bist nicht (mehr) in dieser Runde.<br><br><button class="btn" id="nochmal">Wieder mitspielen</button></div>`; $("#nochmal").onclick = () => beitreten(CODE, ME.name); return; }
    $("#kopfInfo").textContent = ich.name;
    document.body.classList.toggle("ohne-tr", ohneTr());
    let h = (G.nachricht ? `<div class="meldung">📢 ${esc(G.nachricht.text)}</div>` : "") + LT.timerHtml(G);
    if (G.phase === "lobby") {
      h += istHost() ? `<div class="vk-kopf"><div><div class="klein muted">Spielcode für die anderen</div><div class="vk-code">${CODE}</div></div><button class="btn" id="start" ${SP().length >= 2 ? "" : "disabled"}>▶ Spiel starten</button></div>` + lobbyEinstellungen() +
        `<div class="karte" style="margin-top:12px"><h3 style="margin-top:0">Dabei (${SP().length})</h3><div class="tn-zeile">${SP().map(([id, s]) => `<span>${esc(s.name)}${id !== ME.id ? ` <button data-weg="${id}">✕</button>` : " 👑"}</span>`).join("")}</div></div>`
        : `<div class="karte" style="margin-top:20px;text-align:center"><div style="font-size:3rem">${SPIELE[SPIEL].icon}</div><h2 style="margin:0">${esc(SPIELE[SPIEL].titel)}</h2><p>${esc(SPIELE[SPIEL].text)}</p><p>Du bist dabei als <b>${esc(ich.name)}</b>. ⏳ Gleich geht es los …</p></div>`;
    } else if (G.phase === "ende") {
      h += endeHtml(ME.id);
    } else {
      const tid = meinTisch(), t = tid && T(tid);
      if (!t || !E.liste(t.sp).includes(ME.id)) h += `<div class="karte" style="margin-top:20px;text-align:center">⏳ Du bekommst gleich einen Platz an einem Tisch …</div>`;
      else {
        const mit = E.liste(t.sp).filter(id => id !== ME.id).map(name);
        h += `<p class="klein muted" style="margin:10px 0 0">${esc(tid.replace("t", "Tisch "))}${mit.length ? " · mit " + mit.map(esc).join(", ") : ""}</p>` + tischHtml(tid, t, ME.id, false);
        if (istHost()) h += `<div class="btnreihe" style="margin-top:14px"><button class="btn rot klein" id="ende">⏹ Spiel beenden</button></div>`;
      }
    }
    LT.render(app(), h); LT.nachRender();
    verdrahteTisch();
    if (istHost()) { verdrahteEinstellungen(); verdrahteLeitung(); }
  }

  function zeichne() { MODUS === "leitung" ? zeichneLeitung() : zeichneSpieler(); }
  window.VOKABEL_APP = { get G() { return G; }, get P() { return P; } };
  F.initFB();
  MODUS === "leitung" ? startLeitung() : startSpieler();
})();
</script>
</body>
</html>
