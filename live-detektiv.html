<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detektiv-Fall · Farsi-Lernpfad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .wrap{max-width:980px}
  .lv-code{font-size:2.6rem;font-weight:800;letter-spacing:.2em;color:var(--lapis);line-height:1.1}
  .lv-kopf{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:14px 0}
  .fa-g{font-family:var(--fa);direction:rtl;text-align:right}
  .meldung{background:var(--safran-hell);border:1px solid #e6d3ad;border-radius:12px;padding:10px 14px;margin:10px 0}
  .klein-h{font-size:.78rem;font-weight:800;color:var(--tinte2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
  .dt-leiste{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--linie);border-radius:14px;padding:8px 12px;margin:12px 0}
  .chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--linie);border-radius:999px;padding:3px 10px;font-size:.84rem;font-weight:700;background:#fff}
  .chip.ich{border-color:var(--lapis);background:var(--lapis-hell)}
  .chip .pkt{width:8px;height:8px;border-radius:50%;background:#3C7A55}
  .chip.off .pkt{background:#c3c3bb}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
  .tabs .tab{cursor:pointer;font:inherit;font-weight:800}
  .tabs .tab .z{display:inline-block;min-width:1.4em;border-radius:999px;background:var(--safran-hell);color:#6b4b10;font-size:.75rem;padding:0 6px;margin-left:4px}
  .tabs .tab.an .z{background:rgba(255,255,255,.25);color:#fff}
  /* Personen */
  .pers-gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  @media (max-width:520px){.pers-gitter{grid-template-columns:1fr 1fr;gap:8px}.pers{padding:10px}.pers .em{font-size:1.8rem}.pers .rl{font-size:.74rem}}
  .pers{background:#fff;border:1px solid var(--linie);border-radius:16px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative}
  .pers:hover{border-color:var(--lapis)}
  .pers .em{font-size:2.2rem;line-height:1}
  .pers .nm{font-weight:800;font-size:1.1rem;margin-top:6px}
  .pers .nf{font-family:var(--fa);color:var(--lapis);font-size:1.05rem}
  .pers .rl{font-size:.8rem;color:var(--tinte2);min-height:2.2em}
  .pers .wer{margin-top:8px;font-size:.8rem;font-weight:700}
  .pers.meins{border:2px solid var(--lapis)}
  .pers .neu{position:absolute;top:10px;right:10px;background:var(--safran);color:#fff;border-radius:999px;font-size:.72rem;font-weight:800;padding:2px 8px}
  .balken{height:6px;border-radius:6px;background:var(--papier2,#eee);overflow:hidden;margin-top:6px}
  .balken i{display:block;height:100%;background:var(--lapis)}
  /* Verhör */
  .verh-kopf{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .verh-kopf .em{font-size:2.6rem}
  .chat{background:#f3f1ec;border:1px solid var(--linie);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .bub{max-width:88%;border-radius:14px;padding:8px 12px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.06)}
  .bub.frage{align-self:flex-end;background:#e2efe9}
  .bub.antw{align-self:flex-start}
  .bub .wer{font-size:.74rem;font-weight:800;color:var(--tinte2)}
  .bub .fa-g{font-size:1.18rem;line-height:2}
  .bub .de{font-size:.84rem;color:#556;margin-top:4px;border-top:1px dashed var(--linie);padding-top:4px}
  .bub .werkz{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .mini{border:1px solid var(--linie);background:#fff;border-radius:9px;padding:3px 9px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
  .mini:hover{border-color:var(--lapis)}
  .mini.notiz{background:var(--safran-hell);border-color:#e3c98f}
  .mini.ok{background:var(--gruen-hell);border-color:#b9d8c4;cursor:default}
  .wort{cursor:pointer;border-radius:5px;padding:0 1px}
  .wort:hover,.wort.an{background:#fff0c9}
  .nachschl{background:#fffdf5;border:1px solid #ecdcae;border-radius:12px;padding:8px 10px;margin-top:6px;font-size:.88rem}
  .nachschl .z{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:3px 0;border-bottom:1px solid #f1e7c9;cursor:pointer}
  .nachschl .z:last-of-type{border-bottom:0}
  .nachschl .z .f{font-family:var(--fa);font-size:1.15rem;color:var(--lapis);font-weight:700}
  .check{background:#fff;border:2px solid var(--safran);border-radius:14px;padding:10px 12px;margin-top:8px}
  .check .opt{display:block;width:100%;text-align:left;margin:5px 0;border:1px solid var(--linie);background:#fff;border-radius:10px;padding:7px 10px;font:inherit;cursor:pointer}
  .check .opt:hover{border-color:var(--lapis)}
  .check .opt.falsch{background:var(--granat-hell);border-color:#e0b5af;cursor:default}
  .fragen{display:grid;gap:8px;margin-top:12px}
  .frage-btn{border:1.5px solid var(--lapis);background:#fff;border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;text-align:right}
  .frage-btn:hover{background:var(--lapis-hell)}
  .frage-btn .fa-g{font-size:1.15rem;display:block}
  .frage-btn .de{font-size:.8rem;color:var(--tinte2);text-align:left;display:block}
  .gesperrt{border:1.5px dashed #cfcfc6;border-radius:12px;padding:8px 12px;color:var(--tinte2);font-size:.88rem}
  .lex{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:8px;align-items:center}
  .lex .f{font-family:var(--fa);font-size:1.12rem;color:var(--lapis);text-align:right;cursor:pointer}
  /* Notizbuch */
  .notizbuch{background:#fffef8;border:1px solid #e9e1c8;border-radius:16px;padding:6px 16px}
  .notiz{padding:8px 0;border-bottom:1px solid #efe8d2}
  .notiz:last-child{border-bottom:0}
  .notiz .t{font-weight:800}
  .notiz .q{font-size:.78rem;color:var(--tinte2)}
  .leer-notiz{color:var(--tinte2);padding:14px 0}
  /* Lösung */
  .ankl{display:grid;gap:12px}
  .ankl .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .ankl .opts button{border:1.5px solid var(--linie);background:#fff;border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
  .ankl .opts button.an{border-color:var(--lapis);background:var(--lapis);color:#fff}
  /* Bericht */
  .zeile{min-height:52px;border:1.5px solid #c9d6d2;border-radius:14px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;direction:rtl;align-items:center;background:#fbfdfc}
  .zeile .leer{direction:ltr;color:#99a;font-size:.86rem}
  .wks{display:flex;flex-wrap:wrap;gap:7px;direction:rtl;margin-top:10px}
  .wk{font-family:var(--fa);font-size:1.12rem;border:1.5px solid var(--linie);background:#fff;border-radius:10px;padding:4px 11px;cursor:pointer;line-height:1.7}
  .wk:hover{border-color:var(--lapis)}
  .wk.weg{visibility:hidden}
  .zeile .wk{background:#e4f3ee;border-color:#9fc9bb}
  .fertig{background:var(--gruen-hell);border:1px solid #b9d8c4;border-radius:12px;padding:8px 12px}
  .tab-tabelle{width:100%;border-collapse:collapse;font-size:.9rem}
  .tab-tabelle th,.tab-tabelle td{border-bottom:1px solid var(--linie);padding:6px 8px;text-align:left;vertical-align:top}
  @media print{.kopf,.nodruck{display:none!important}.chat{break-inside:auto}}
</style>
</head>
<body>
<header class="kopf">
  <div class="wrap">
    <a href="aktivitaeten.html" class="medaillon" style="text-decoration:none">فا</a>
    <div><h1 id="kopfTitel">Detektiv-Fall</h1><div class="unter">Selbstlernen · 1–4 Personen · Farsi-Lernpfad</div></div>
    <div class="rechts"><span class="kopf-btn" id="kopfInfo" style="background:transparent;border-color:transparent"></span><a class="kopf-btn" href="aktivitaeten.html">← Aktivitäten</a></div>
  </div>
</header>
<main class="wrap" style="padding-bottom:60px"><div id="app"><p class="muted" style="margin-top:30px">Lade …</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/core.js"></script>
<script src="assets/live-tools.js"></script>
<script src="assets/woerterbuch.js"></script>
<script src="assets/detektiv/engine.js"></script>
<script src="assets/detektiv/pashmak.js"></script>
<script>
(function () {
  const F = window.FARSI, { $, $$, esc, toast } = F, E = window.DETEKTIV_ENGINE, LT = window.LIVE_TOOLS, WB = window.WOERTERBUCH;
  const qs = new URLSearchParams(location.search);
  const istLK = !!qs.get("leitung");
  let CODE = (qs.get("code") || "").replace(/\D/g, "") || null;
  let G = null, REF = null, ME = null, FALL = null;
  /* lokaler Ansichtszustand (nicht gespeichert) */
  let TAB = "befragen", OFFEN = null, CHECK = null, NACH = null, WAHL = {}, BER = {}, WB_UI = null, MELD = null;
  const DE = new Set();
  const app = () => $("#app");
  const gRef = c => F.ref(`live/detektiv/${c}`);
  const LS_LETZTE = "farsi_detektiv_letzte";

  /* ---------- Speicher: zuletzt gespielte Fälle (für „Weiterspielen“) ---------- */
  function letzte() { try { return JSON.parse(localStorage.getItem(LS_LETZTE) || "[]"); } catch (e) { return []; } }
  function merke(c) { try { const l = letzte().filter(x => x.code !== c); l.unshift({ code: c, ts: Date.now() }); localStorage.setItem(LS_LETZTE, JSON.stringify(l.slice(0, 8))); } catch (e) { } }

  /* ---------- Firebase ---------- */
  function hoere(c) {
    if (REF) REF.off();
    REF = gRef(c);
    REF.on("value", s => {
      G = s.val();
      if (!istLK) LT.pruefeNeuLaden(G);
      FALL = G ? (window.DETEKTIV_FAELLE || {})[G.fall || "pashmak"] : null;
      if (LT.tipptGerade(zeichne)) return;
      zeichne();
    }, e => fehler(e, true));
  }
  function fehler(e, hart) {
    console.error(e);
    if (!hart && G) { toast("Das hat nicht geklappt – bitte noch einmal tippen."); return; }
    app().innerHTML = `<div class="karte" style="margin-top:20px"><b>Das hat nicht geklappt.</b><p class="klein muted">${esc(e && e.message || e)}</p><p class="klein">Bitte die Internetverbindung prüfen und die Seite neu laden.</p></div>`;
  }
  const schreib = (p, w) => gRef(CODE).child(p).set(w).catch(e => fehler(e));
  const upd = o => gRef(CODE).update(o).catch(e => fehler(e));

  /* ---------- Helfer ---------- */
  const T = () => (G && G.teams && G.teams.f) || {};
  const SP = () => (G && G.spieler) || {};
  const name = id => id === (ME && ME.id) ? "du" : ((SP()[id] || {}).name || "?");
  const Name = id => id === (ME && ME.id) ? "Du" : ((SP()[id] || {}).name || "?");
  const hilfe = () => !(G && G.hilfe === false);
  const person = id => FALL.personen.find(p => p.id === id);
  const zustaendig = pid => (T().verteilung || {})[pid] || null;
  const istMeins = pid => !!ME && zustaendig(pid) === ME.id;
  const darfStarten = () => !!ME && (!G.host || G.host === ME.id);
  const uhr = ts => new Date(ts || Date.now()).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const datum = ts => new Date(ts || Date.now()).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
  const gesperrtSicht = () => istLK && !ME;   /* Lehrkraft schaut nur zu */

  /* Persischer Text: jedes Wort antippbar (→ Wörterbuch) */
  function faHtml(text, key) {
    return E.woerter(text).map((w, i) => `<span class="wort ${NACH && NACH.key === key && NACH.i === i ? "an" : ""}" data-wk="${esc(key)}" data-wi="${i}">${esc(w)}</span>`).join(" ");
  }
  const NAMEN = () => { const m = new Map([[E.strip("پَشمَک"), "Pashmak (Name der Katze)"]]); FALL.personen.forEach(p => E.woerter(p.nameFa).forEach(w => { const s = E.strip(w); if (s !== "آقای" && s !== "آقا") m.set(s, p.name + " (Name)"); })); return m; };
  function nachschlagHtml(key) {
    if (!NACH || NACH.key !== key) return "";
    const tok = NACH.wort, nm = NAMEN().get(E.strip(tok).replace(/[‌]/g, ""));
    let inhalt;
    if (nm) inhalt = `<div>👤 <b>${esc(nm)}</b></div>`;
    else if (!WB.daten) inhalt = `<div class="muted">Wörterbuch wird geladen …</div>`;
    else {
      const r = E.nachschlagen(tok, WB.daten.W, WB.normFa, 4);
      inhalt = r.length ? r.map(w => `<div class="z" data-say="${esc(w.fa)}"><div><b>${esc(w.de)}</b><div class="klein muted">${w.tr ? `<i>${esc(w.tr)}</i>` : ""}${w.stamm ? ` · Präsensstamm <span class="fa">${esc(w.stamm)}</span>` : ""}</div></div><div class="f">${esc(w.fa)}</div></div>`).join("")
        : `<div class="muted">Kein Eintrag gefunden – vielleicht steckt eine Endung dran. Probier es im Wörterbuch.</div>`;
    }
    return `<div class="nachschl"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="fa" style="font-size:1.2rem">${esc(tok)}</span><span><button class="mini" data-wbsuche="${esc(E.strip(tok))}">🔎 im Wörterbuch</button> <button class="mini" data-nachweg="1">✕</button></span></div>${inhalt}</div>`;
  }

  /* =====================================================================
     START: neuer Fall / weiterspielen / Code eingeben
     ===================================================================== */
  async function startSpieler() {
    if (!(await F.brauchtCode())) return;
    const s = F.sitzung();
    let lk = null; try { lk = localStorage.getItem("farsi_lk_spieler"); if (!lk) { lk = "lk" + Math.random().toString(36).slice(2, 7); localStorage.setItem("farsi_lk_spieler", lk); } } catch (e) { lk = "lk0"; }
    ME = s ? { id: s.code, name: s.name || s.code } : { id: lk, name: "Lehrkraft" };
    $("#kopfInfo").textContent = ME.name;
    if (CODE) beitreten(CODE); else zeichneStart();
  }
  async function zeichneStart(meld) {
    const Fz = window.DETEKTIV_FAELLE.pashmak, L = letzte();
    let h = `<div class="karte" style="margin-top:18px"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="font-size:3rem">🕵️</div><div><h2 style="margin:0">Detektiv-Fall: ${esc(Fz.titel)} ${Fz.icon}</h2><div class="fa" style="color:var(--lapis);font-size:1.2rem">${esc(Fz.titelFa)}</div></div></div>
      <p>${esc(Fz.intro.de)}</p>
      <p class="klein muted">Für 1–4 Personen · ${esc(Fz.dauer)} · Niveau: Fortgeschritten (Beginn) · Jede Person spielt am eigenen Gerät. Der Spielstand wird automatisch gespeichert – ihr könnt jederzeit aufhören und später weitermachen.</p>
      <h3 style="margin-bottom:6px">Neuen Fall öffnen</h3>
      <div class="btnreihe"><button class="btn" data-neu="1">🛟 mit Hilfe (deutsche Übersetzungen)</button><button class="btn zwei" data-neu="0">💪 ohne Hilfe (nur Persisch)</button></div>
      <p class="klein muted" style="margin-bottom:0">Wörterbuch und Wortlisten gibt es in beiden Versionen. Wer den Fall öffnet, bekommt einen Spielcode – den geben die anderen ein.</p></div>`;
    h += `<div class="karte" style="margin-top:12px"><h3 style="margin-top:0">Mitspielen oder weiterspielen</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><input class="feld" id="code" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="Spielcode" style="max-width:160px;text-align:center;font-size:1.3rem;letter-spacing:.2em"><button class="btn" id="los">Los ➜</button></div>
      <p class="klein" style="color:var(--granat);min-height:1em">${esc(meld || "")}</p>
      <div id="letzteListe">${L.length ? `<div class="klein-h">Deine letzten Fälle</div><p class="muted klein">wird geladen …</p>` : ""}</div></div>`;
    app().innerHTML = h;
    $$("[data-neu]").forEach(b => b.onclick = () => neuerFall(b.dataset.neu === "1"));
    $("#los").onclick = () => beitreten(String($("#code").value).replace(/\D/g, ""));
    $("#code").onkeydown = e => { if (e.key === "Enter") $("#los").click(); };
    if (L.length) {
      const z = await Promise.all(L.map(async x => { try { const g = (await F.mitTimeout(gRef(x.code).once("value"), 6000)).val(); return g ? { x, g } : null; } catch (e) { return null; } }));
      const ok = z.filter(Boolean), box = $("#letzteListe"); if (!box) return;
      box.innerHTML = ok.length ? `<div class="klein-h">Deine letzten Fälle</div><div style="display:grid;gap:6px">${ok.map(({ x, g }) => {
        const Fx = window.DETEKTIV_FAELLE[g.fall || "pashmak"], p = E.fortschritt(Fx, (g.teams || {}).f), geloest = (((g.teams || {}).f || {}).anklage || {}).geloest;
        const leute = E.reihe(g.spieler).map(id => (g.spieler[id] || {}).name).join(", ");
        return `<div class="dt-leiste" style="margin:0"><div><b>${Fx.icon} ${esc(Fx.titel)}</b> · Code <b>${x.code}</b> · ${datum(g.erstellt)}<div class="klein muted">${esc(leute)} · 📓 ${p.hinweise}/${p.hinweiseMax} Hinweise${geloest ? " · ✅ gelöst" : ""}</div></div><button class="btn klein" data-weiter="${x.code}">${geloest ? "ansehen" : "▶ weiterspielen"}</button></div>`; }).join("")}</div>` : "";
      $$("[data-weiter]").forEach(b => b.onclick = () => beitreten(b.dataset.weiter));
    }
  }
  async function neuerFall(mitHilfe) {
    const d = { erstellt: Date.now(), phase: "lobby", fall: "pashmak", hilfe: mitHilfe, host: ME.id, spieler: { [ME.id]: { name: ME.name, ts: Date.now() } } };
    try { CODE = await LT.neueRunde(gRef, d); } catch (e) { return fehler(e, true); }
    merke(CODE); history.replaceState(null, "", "?code=" + CODE);
    LT.verbindung(gRef(CODE).child("spieler/" + ME.id));
    hoere(CODE);
  }
  async function beitreten(c) {
    if (!/^\d{4}$/.test(c || "")) return zeichneStart("Der Spielcode hat vier Ziffern.");
    let g; try { g = (await F.mitTimeout(gRef(c).once("value"), 8000)).val(); } catch (e) { return fehler(e, true); }
    if (!g || !g.fall) return zeichneStart("Diesen Spielcode gibt es nicht.");
    CODE = c; merke(c); history.replaceState(null, "", "?code=" + c);
    const sp = g.spieler || {};
    if (!sp[ME.id]) {
      if (E.reihe(sp).length >= 4) return zeichneStart("In diesem Fall ermitteln schon 4 Personen.");
      await gRef(c).child("spieler/" + ME.id).set({ name: ME.name, ts: Date.now() }).catch(e => fehler(e, true));
    }
    LT.verbindung(gRef(c).child("spieler/" + ME.id));
    hoere(c);
  }

  /* =====================================================================
     LOBBY
     ===================================================================== */
  function lobbyHtml() {
    const ids = E.reihe(SP());
    return `<div class="karte" style="margin-top:14px"><h2 style="margin-top:0">${FALL.icon} ${esc(FALL.titel)} <span class="fa" style="color:var(--lapis)">${esc(FALL.titelFa)}</span></h2>
      <div class="lv-kopf" style="margin:6px 0"><div><div class="klein muted">Spielcode – für die anderen und fürs Weiterspielen</div><div class="lv-code">${CODE}</div></div>
      <div class="klein" style="max-width:360px">Die anderen öffnen 🎮 <b>Spielcode</b> auf der Startseite (oder diese Aktivität) und geben <b>${CODE}</b> ein. Ihr könnt auch allein ermitteln.</div></div>
      <div class="klein-h">Detektive (${ids.length}/4)</div><div class="btnreihe">${ids.map(id => `<span class="chip ${id === ME.id ? "ich" : ""}">🕵️ ${esc(Name(id))}</span>`).join("")}</div>
      <div class="klein-h">Version</div>
      <div class="btnreihe">${darfStarten() ? `<button class="btn ${hilfe() ? "" : "zwei"} klein" data-hilfe="1">🛟 mit Hilfe</button><button class="btn ${hilfe() ? "zwei" : ""} klein" data-hilfe="0">💪 ohne Hilfe</button>` : `<span class="chip">${hilfe() ? "🛟 mit Hilfe" : "💪 ohne Hilfe"}</span>`}</div>
      <div class="meldung klein" style="margin-top:14px"><b>So läuft es:</b> Die fünf Personen im Haus werden unter euch aufgeteilt – jede/r befragt „seine“ Leute. Was ihr herausfindet, notiert ihr im gemeinsamen 📓 Notizbuch. Manche Fragen gehen erst, wenn jemand anderes einen passenden Hinweis gefunden hat – also redet miteinander! Zum Schluss klagt ihr gemeinsam an: Wer? Was? Wann? Wo?</div>

        const hn = CHECK.hn; CHECK = null;
        gRef(CODE).child("teams/f/hinweise/" + hn).transaction(cur => cur || { p: ME.id, ts: Date.now() }).then(() => toast("📓 Notiert: " + H.titel)).catch(e => fehler(e));
        if (hn === "gestaendnis" || hn === "wo") MELD = "💡 Jetzt wisst ihr genug, oder? Schaut bei ⚖️ <b>Lösung</b> vorbei.";
      } else { CHECK.falsch.push(i); gRef(CODE).child("teams/f/fehler").transaction(v => (v || 0) + 1).catch(() => { }); zeichne(); }
    });
    $$("[data-ankl]").forEach(b => b.onclick = () => { WAHL[b.dataset.ankl] = +b.dataset.i; zeichne(); });
    const an = $("#anklagen"); if (an) an.onclick = () => anklagen(an);
    $$("[data-hilfe]").forEach(b => b.onclick = () => schreib("hilfe", b.dataset.hilfe === "1"));
    $$("[data-drucken]").forEach(b => b.onclick = () => window.print());
    /* Bericht */
    $$("[data-brein]").forEach(b => b.onclick = () => { const i = +b.dataset.brein; (BER[i] = BER[i] || []).push(+b.dataset.k); zeichne(); });
    $$("[data-braus]").forEach(b => b.onclick = () => { const i = +b.dataset.braus; BER[i].splice(+b.dataset.n, 1); zeichne(); });
    $$("[data-bleer]").forEach(b => b.onclick = () => { BER[+b.dataset.bleer] = []; zeichne(); });
    $$("[data-bpruef]").forEach(b => b.onclick = () => {
      const i = +b.dataset.bpruef, toks = E.woerter(FALL.bericht[i].fa), misch = mischFest(toks, i), gebaut = BER[i].map(k => misch[k]);
      if (gebaut.join(" ") === toks.join(" ")) { schreib(`teams/f/bericht/${i}`, { p: ME.id, ts: Date.now() }); toast("✅ Richtig!"); }
      else { const ok = gebaut.findIndex((w, n) => w !== toks[n]); toast(ok > 0 ? `🤏 Die ersten ${ok} Wörter stimmen.` : "Noch nicht – welches Wort steht am Anfang?"); }
    });
  }
  function frage(pid, qid, btn) {
    if (btn) btn.disabled = true;
    const key = pid + "_" + qid;
    gRef(CODE).child("teams/f/gelesen/" + key).transaction(cur => cur || { p: ME.id, ts: Date.now() }).then(() => {
      const q = person(pid).fragen.find(x => x.id === qid);
      setTimeout(() => { const b = $$(".bub.antw"); if (b.length) b[b.length - 1].scrollIntoView({ behavior: "smooth", block: "center" }); }, 80);
      if (q && q.hinweis && !(T().hinweise || {})[q.hinweis]) setTimeout(() => toast("🔍 In dieser Antwort steckt ein Hinweis!"), 400);
    }).catch(e => fehler(e));
  }
  function anklagen(btn) {
    btn.disabled = true;
    const res = E.pruefeAnklage(FALL, WAHL), w = Object.assign({}, WAHL);
    gRef(CODE).child("teams/f/anklage").transaction(cur => {
      cur = cur || {}; if (cur.geloest) return cur;
      cur.versuche = (cur.versuche || 0) + 1;
      cur.letzter = { richtig: res.richtig, p: ME.id, ts: Date.now() };
      if (res.ok) { cur.geloest = Date.now(); cur.wahl = w; }
      return cur;
    }).then(() => { if (res.ok) { TAB = "ende"; zeichne(); window.scrollTo(0, 0); } else toast(`${res.richtig} von ${FALL.anklage.length} richtig – ermittelt weiter!`); })
      .catch(e => fehler(e));
  }

  /* =====================================================================
     LEHRKRAFT: Übersicht aller Fälle
     ===================================================================== */
  function startLeitung() {
    firebase.auth().onAuthStateChanged(async u => {
      if (!u) { app().innerHTML = `<div class="karte" style="margin-top:20px"><h2>Nur für Lehrkräfte</h2><p>Bitte zuerst in der <a href="konsole.html">Konsole</a> anmelden.</p></div>`; return; }
      if (CODE) { hoere(CODE); return; }
      app().innerHTML = `<p class="muted" style="margin-top:20px">Lade Fälle …</p>`;
      let alle = {};
      try { alle = (await F.mitTimeout(F.ref("live/detektiv").orderByChild("erstellt").limitToLast(40).once("value"), 9000)).val() || {}; } catch (e) { return fehler(e, true); }
      const l = Object.entries(alle).sort(([, a], [, b]) => (b.erstellt || 0) - (a.erstellt || 0));
      app().innerHTML = `<div class="karte" style="margin-top:18px"><h2 style="margin-top:0">🕵️ Detektiv-Fälle – Übersicht</h2>
        <p class="klein muted">Die TN öffnen den Fall selbst (🎲 Aktivitäten → Detektiv-Fall) und bekommen einen Code. Hier siehst du, wie weit sie sind.</p>
        ${l.length ? `<table class="tab-tabelle"><tr><th>Code</th><th>Datum</th><th>Detektive</th><th>Fortschritt</th><th></th></tr>${l.map(([c, g]) => {
          const Fx = window.DETEKTIV_FAELLE[g.fall || "pashmak"], f = (g.teams || {}).f || {}, p = E.fortschritt(Fx, f), a = f.anklage || {};
          return `<tr><td><b>${c}</b></td><td>${datum(g.erstellt)} ${uhr(g.erstellt)}</td><td>${esc(E.reihe(g.spieler).map(id => g.spieler[id].name).join(", "))}<div class="klein muted">${g.hilfe === false ? "ohne Hilfe" : "mit Hilfe"}</div></td>
            <td>${g.phase === "lobby" ? "wartet" : `📓 ${p.hinweise}/${p.hinweiseMax} · ❓ ${p.fragen}/${p.fragenMax}<div class="klein muted">Lösungsversuche: ${a.versuche || 0}${a.geloest ? " · ✅ gelöst" : ""} · Fehler beim Notieren: ${f.fehler || 0}</div>`}</td>
            <td><a class="btn zwei klein" href="?leitung=1&code=${c}" style="text-decoration:none">ansehen</a></td></tr>`; }).join("")}</table>` : `<p class="muted">Noch keine Fälle.</p>`}</div>`;
    });
  }

  function zeichne() {
    if (!G) { if (istLK) app().innerHTML = `<div class="karte" style="margin-top:20px">Diesen Fall gibt es nicht. <a href="?leitung=1">Zur Übersicht</a></div>`; else zeichneStart("Diesen Fall gibt es nicht (mehr)."); return; }
    if (!FALL) return fehler(new Error("Fall nicht gefunden: " + G.fall), true);
    if (!istLK && ME && !SP()[ME.id]) { app().innerHTML = `<div class="karte" style="margin-top:20px">Du bist nicht (mehr) in diesem Fall. <button class="btn klein" id="wieder">Wieder mitmachen</button></div>`; $("#wieder").onclick = () => beitreten(CODE); return; }
    if (G.phase === "lobby") { if (istLK) { app().innerHTML = `<div class="karte" style="margin-top:20px">Fall ${CODE} wartet noch auf den Start. <a href="?leitung=1">Zur Übersicht</a></div>`; return; } LT.render(app(), lobbyHtml()); verdrahteLobby(); return; }
    if (istLK && TAB === "befragen" && !OFFEN && !zeichne.lkInit) { zeichne.lkInit = true; TAB = "notiz"; }
    zeichneSpiel();
  }
  window.DETEKTIV_APP = { zeichne, get G() { return G; }, get ME() { return ME; }, setTab(t) { TAB = t; zeichne(); }, oeffne(p) { TAB = "befragen"; OFFEN = p; zeichne(); } };
  F.initFB();
  istLK ? startLeitung() : startSpieler();
})();
</script>
</body>
</html>
