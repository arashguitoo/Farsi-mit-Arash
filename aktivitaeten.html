<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aktivitäten · Farsi-Lernpfad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .ak-gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .ak{background:var(--karte);border:1px solid var(--linie);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--schatten)}
  .ak .ico{font-size:2.2rem}
  .ak h3{margin:0;font-size:1.1rem}
  .ak .fa{color:var(--lapis);font-size:1.1rem}
  .ak .tags{display:flex;gap:6px;flex-wrap:wrap}
  .ak .tag{font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--papier2);color:var(--tinte2)}
  .ak .tag.live{background:#fbe9e6;color:var(--granat)}
  .ak .unten{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .beitritt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .beitritt input{max-width:110px;text-align:center;letter-spacing:.2em;font-size:1.1rem}
  h2.abschnitt{font-size:1.15rem;margin:26px 0 10px}
</style>
</head>
<body>
<header class="kopf">
  <div class="wrap">
    <a href="index.html" class="medaillon" style="text-decoration:none">فا</a>
    <div><h1>Aktivitäten</h1><div class="unter">Live im Unterricht & zusätzliche Übungen</div></div>
    <div class="rechts"><a class="kopf-btn" id="zurueck" href="index.html">← Lernpfad</a></div>
  </div>
</header>
<main class="wrap" style="padding-bottom:60px">
  <div class="karte" id="hinweis" style="margin-top:18px"></div>
  <h2 class="abschnitt">🔴 Live im Unterricht</h2>
  <p class="klein muted" style="margin-top:-6px">Deine Lehrkraft startet die Aktivität und zeigt dir einen Spielcode.</p>
  <div class="ak-gitter" id="live"></div>
  <h2 class="abschnitt">📎 Zusätzliche Übungen & Material</h2>
  <div class="ak-gitter" id="zusatz"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/core.js"></script>
<script>
/* Neue Aktivitäten einfach hier eintragen. */
const AKTIVITAETEN = {
  live: [
    { id: "truhe", datei: "live-truhe.html", selbst: true, icon: "🗝️", titel: "Das Geheimnis von Omas Truhe", fa: "رازِ صندوقچه‌ی مادربزرگ",
      text: "Schatzsuche in Zweierteams: Brief ordnen, Foto finden, Stadtplan, Telefonat – jede Station bringt eine Ziffer für das Zahlenschloss. Jede Person sieht nur ihre Hälfte der Hinweise.",
      tags: ["2er-Teams", "lang 120 / kurz 60 Min.", "mit Wörterbuch", "ab Fortgeschritten 1"] },
    { id: "geschenk", datei: "live-truhe.html?spiel=geschenk", selbst: true, icon: "🎁", titel: "Das Geburtstagsgeschenk", fa: "هِدیه‌یِ تَوَلُّد",
      text: "Die leichte, kurze Schnitzeljagd: Saras Nachricht ordnen, das richtige Foto finden, den Weg auf dem Stadtplan – drei Ziffern öffnen die Box. Einfache Sätze, vokalisiert, mit aufklappbarem Wörterbuch.",
      tags: ["2er-Teams", "lang 45 / kurz 25 Min.", "leicht", "mit Wörterbuch"] },
    { id: "gespraech", datei: "live-gespraech.html", selbst: true, icon: "🗣️", titel: "Gesprächs-Simulation", fa: "گُفت‌وگو",
      text: "Reihum sprechen: Wer dran ist, sagt einen Satz auf Persisch, die anderen reagieren mit Ja, Nein oder Vielleicht – und die Geschichte verzweigt sich. Sechs Szenarien: Essen, WG, Arbeit, Urlaub, Tag planen, Gäste. Drei Stufen: Auswahl, Satzbausteine, frei sprechen. Am Ende gibt es eure Geschichte als Protokoll.",
      tags: ["2–8 Personen", "30–60 Min.", "3 Stufen", "6 Szenarien"] }
  ],
  zusatz: [
    { icon: "✍️", titel: "Persisch schreiben – Übungsheft", fa: "تمرینِ خوش‌نویسی", text: "Handschrift üben zu Lektion 1: alle Buchstaben mit ihren Formen, Nachspuren und Wörter. Zum Ausdrucken (9 Seiten A4).",
      link: "material/persisch-schreiben-uebungsheft.pdf", knopf: "📄 PDF öffnen", tags: ["Grundkurs · Lektion 1", "PDF"] }
  ]
};
const mitQ = (datei, q) => datei + (datei.includes("?") ? "&" : "?") + q;
(async function () {
  const F = window.FARSI, { $, esc } = F;
  if (!(await F.brauchtCode())) return;
  const s = F.sitzung(), lehrkraft = !s;
  if (lehrkraft) $("#zurueck").href = "konsole.html", $("#zurueck").textContent = "← Konsole";
  $("#hinweis").innerHTML = lehrkraft
    ? `<b>Ansicht für Lehrkräfte.</b> Mit „▶ Leitung starten“ eröffnest du eine Runde und bekommst einen Spielcode für den Kurs. Am besten teilst du die Beamer-Ansicht im Online-Raum und schickst die Teams in Breakout-Räume.`
    : `<b>Hallo ${esc(s.name)}!</b> Hier findest du Aktivitäten für den Unterricht und zusätzliches Material.`;
  $("#live").innerHTML = AKTIVITAETEN.live.map(a => `<div class="ak"><div class="ico">${a.icon}</div><h3>${esc(a.titel)}</h3><div class="fa">${esc(a.fa)}</div>
    <div class="klein">${esc(a.text)}</div><div class="tags"><span class="tag live">LIVE</span>${a.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    <div class="unten">${lehrkraft ? `<a class="btn" href="${mitQ(a.datei, (a.leitung || "?leitung=1").slice(1))}" style="text-decoration:none">▶ Leitung starten</a>`
      : `<div class="beitritt"><input class="feld" data-code="${a.id}" inputmode="numeric" maxlength="4" placeholder="Code"><button class="btn" data-los="${a.id}" data-datei="${a.datei}">Beitreten</button></div>
      ${a.selbst ? `<a class="btn zwei klein" href="${mitQ(a.datei, "neu=1")}" style="text-decoration:none" title="Ohne Lehrkraft spielen – du bist Host">👥 Eigene Runde starten</a>` : ""}`}</div></div>`).join("");
  document.querySelectorAll("[data-los]").forEach(b => b.onclick = () => {
    const c = F.normCode(document.querySelector(`[data-code="${b.dataset.los}"]`).value).replace(/\D/g, "");
    location.href = c ? mitQ(b.dataset.datei, "code=" + c) : b.dataset.datei;
  });
  document.querySelectorAll("[data-code]").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") document.querySelector(`[data-los="${i.dataset.code}"]`).click(); }));
  $("#zusatz").innerHTML = AKTIVITAETEN.zusatz.map(a => `<div class="ak"><div class="ico">${a.icon}</div><h3>${esc(a.titel)}</h3><div class="fa">${esc(a.fa)}</div>
    <div class="klein">${esc(a.text)}</div><div class="tags">${a.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    <div class="unten"><a class="btn zwei" href="${a.link}" target="_blank" style="text-decoration:none">${a.knopf}</a></div></div>`).join("");
})();
</script>
</body>
</html>
