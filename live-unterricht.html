<style>
  .wrap{max-width:1180px}
  .klein-h{font-size:.78rem;font-weight:800;color:var(--tinte2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}

  .akt-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
  .akt-liste a{display:block;background:#fff;border:1px solid var(--linie);border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit}

  .tm-A{--tf:#2f5d7c}.tm-B{--tf:#b5852c}.tm-C{--tf:#3c7a5a}
  .score{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .score .s{flex:1;min-width:150px;background:#fff;border:1.5px solid var(--linie);border-top:5px solid var(--tf);border-radius:12px;padding:8px 12px}

  .chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;background:#fff;border:1.5px solid var(--tf,var(--linie));margin:2px;cursor:pointer}
  .team-badge{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:800;color:#fff;background:var(--tf,var(--lapis))}
  .plan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:#d9dcd6;padding:12px;border-radius:14px;direction:ltr;margin-top:8px}
  .ort{background:#fff;border:2px solid transparent;border-radius:8px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px 2px;cursor:pointer;font:inherit;color:inherit}

  body.spiegel .kopf,body.spiegel #melde-knopf{display:none!important}
  body.spiegel.nurlesen #app{pointer-events:none}
  body.lw #spiegelBox{display:none}

<body>
<header class="kopf">

<script>
/* ===================== Planung (rein) ===================== */
window.UNTERRICHT = (function () {
  const INTERAKTIV = ["paare", "wahl", "bauen", "sortieren", "finden", "lesen", "ordnen", "memory", "tempo", "zuordnen"];
  const TAFEL = ["info", "text", "buchstaben"];
  const TYP_ICON = { paare: "🔗", wahl: "☑️", bauen: "🧱", sortieren: "🗂️", finden: "🔍", lesen: "📖", ordnen: "🔢", memory: "🃏", tempo: "⚡", zuordnen: "🧩", interview: "🗣️", puzzle: "🧩", sprechen: "🎤", partner: "👥", weg: "🗺️", rolle: "🎭" };
  const TYP_NAME = { paare: "Paare finden", wahl: "Quiz", bauen: "Bauen", sortieren: "Sortieren", finden: "Finden", lesen: "Lesen", ordnen: "Ordnen", memory: "Memory", tempo: "Blitz", zuordnen: "Zuordnen", interview: "Partner-Interview", puzzle: "Vorlesen & ordnen", sprechen: "Sprechrunde", partner: "Partnergespräch", weg: "Stadtplan-Spiel", rolle: "Rollenspiel mit Geheimauftrag" };
  const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  function rng(seed) { let a = hash(seed); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function mischen(a, r) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const runde5 = m => Math.max(5, Math.round(m / 5) * 5);
  const istDialog = k => k.typ === "text" && (k.zeilen || []).filter(z => /^[^:،]{2,20}:/.test(z.fa)).length >= Math.min(4, k.zeilen.length);
  /* Automatischer 90-Minuten-Plan aus einer Lektion */
  function autoPlan(eintrag, L, vorEintrag, vorL) {
    const main = L.stationen.filter(s => !s.zusatz), zus = L.stationen.filter(s => s.zusatz);
    const check = main.filter(s => /check/i.test(s.titel)).pop();
    const bl = [], ref = (st, i) => ({ ref: `${eintrag.id}/${st.id}/${i}` });
    if (eintrag.bereich === "a" && vorL) {
      const vc = vorL.stationen.filter(s => !s.zusatz && /check/i.test(s.titel)).pop() || vorL.stationen.filter(s => !s.zusatz).pop();
      const auf = []; vc.karten.forEach((k, i) => { if (INTERAKTIV.includes(k.typ)) auf.push({ ref: `${vorEintrag.id}/${vc.id}/${i}` }); });
      const intro = vorL.stationen[0].karten.findIndex(k => k.typ === "info" && k.beispiele && k.beispiele.length);
      bl.push({ id: "rueck", icon: "🔁", titel: "Wiederholung: " + vorEintrag.titel, minuten: 10, tafel: intro >= 0 ? [{ ref: `${vorEintrag.id}/${vorL.stationen[0].id}/${intro}` }] : [], aufgaben: auf.slice(0, 5) });
    }
    main.filter(s => s !== check).forEach(st => {
      const tafel = [], auf = [];
      st.karten.forEach((k, i) => {
        if (TAFEL.includes(k.typ)) tafel.push(ref(st, i));
        if (INTERAKTIV.includes(k.typ)) auf.push(ref(st, i));
        if (k.typ === "text" && (k.zeilen || []).length >= 5) auf.push({ typ: "puzzle", titel: (istDialog(k) ? "Dialog" : "Text") + " vorlesen & ordnen: " + (k.titel || st.titel), quelle: `${eintrag.id}/${st.id}/${i}` });
        if (k.typ === "info" && (k.beispiele || []).filter(b => /[؟?]\s*$/.test(b.fa)).length >= 3) auf.push({ typ: "partner", titel: "Fragen zu zweit: " + (k.titel || st.titel), fragen: k.beispiele.filter(b => /[؟?]\s*$/.test(b.fa)).map(b => [b.fa, b.de]) });
      });
      if (tafel.length || auf.length) bl.push({ id: st.id, icon: "📘", titel: st.titel, gewicht: tafel.length * 2 + auf.length * 3, tafel, aufgaben: auf });
    });
    if (check) { const auf = []; check.karten.forEach((k, i) => { if (INTERAKTIV.includes(k.typ)) auf.push(ref(check, i)); }); bl.push({ id: "ende", icon: "✅", titel: "Abschluss: " + check.titel, minuten: 10, tafel: [], aufgaben: auf }); }
    const fest = bl.filter(b => b.minuten).reduce((s, b) => s + b.minuten, 0), offen = bl.filter(b => !b.minuten), sumG = offen.reduce((s, b) => s + b.gewicht, 0) || 1;
    offen.forEach(b => { b.minuten = runde5((90 - fest) * b.gewicht / sumG); });
    if (offen.length) { const diff = 90 - bl.reduce((s, b) => s + b.minuten, 0), gr = offen.slice().sort((a, b) => b.minuten - a.minuten)[0]; gr.minuten = Math.max(5, gr.minuten + diff); }
    if (zus.length) { const auf = []; zus.forEach(st => st.karten.forEach((k, i) => { if (INTERAKTIV.includes(k.typ)) auf.push({ ref: `${eintrag.id}/${st.id}/${i}`, gruppe: st.titel }); })); if (auf.length) bl.push({ id: "zusatz", icon: "➕", titel: "Zusatzaufgaben (Reserve)", minuten: 0, tafel: [], aufgaben: auf }); }
    return { lektion: eintrag.id, titel: "Automatischer Plan aus der Lektion", minuten: 90, auto: true, bloecke: bl };
  }
  /* Paare/Kreise bilden: [{fragt: id, wird: id}] – bei ungerader Zahl ein Dreier-Kreis */
  function paare(ids, seed) {
    const m = mischen(ids, rng(seed)), gruppen = [];
    for (let i = 0; i < m.length; i += 2) gruppen.push(m.slice(i, i + 2));
    if (gruppen.length > 1 && gruppen[gruppen.length - 1].length === 1) gruppen[gruppen.length - 2].push(gruppen.pop()[0]);
    const ziel = {}; gruppen.forEach(g => g.forEach((id, i) => { ziel[id] = g[(i + 1) % g.length]; }));
    return { gruppen, ziel };
  }
  /* Familien-/Interviewkarte einer Person (immer gleich für Person + Aufgabe) */
  function karteVon(felder, pid, id) { const r = rng(pid + "|" + id), o = {}; felder.forEach(f => { o[f.key] = Math.floor(r() * f.werte.length); }); return o; }
  /* Puzzle: Text in Abschnitte teilen */
  function teile(k, gruppen) {
    const z = k.zeilen, out = []; let i = 0;
    (gruppen && gruppen.length ? gruppen : Array.from({ length: Math.ceil(z.length / 2) }, () => 2)).forEach(n => { const s = z.slice(i, i + n); i += n; if (s.length) out.push(s); });
    if (i < z.length) out.push(z.slice(i));
    return out;
  }
  /* Stadtplan-Spiel: 12 Orte auf 3 × 4 Blöcken, Ziel zufällig – pro Gruppe und Runde anders */
  const ORTE = [["🏦", "بانک", "Bank"], ["💊", "داروخانه", "Apotheke"], ["🚇", "ایستگاهِ مِترو", "U-Bahn-Station"], ["🥖", "نانوایی", "Bäckerei"], ["🏛️", "موزه", "Museum"], ["🏥", "بیمارستان", "Krankenhaus"], ["🌳", "پارک", "Park"], ["🎬", "سینَما", "Kino"], ["🏨", "هُتِل", "Hotel"], ["🍽️", "رِستوران", "Restaurant"], ["🏫", "مَدرِسه", "Schule"], ["📚", "کِتاب‌فُروشی", "Buchhandlung"], ["☕", "کافه", "Café"], ["📮", "پُست", "Post"], ["🛒", "سوپِرمارکِت", "Supermarkt"], ["🚌", "ایستگاهِ اُتوبوس", "Bushaltestelle"]];
  function wegRunde(seed) { const r = rng(seed), orte = mischen(ORTE.map((_, i) => i), r).slice(0, 12), ziel = Math.floor(r() * 12); return { orte, ziel }; }
  /* Rollenspiel: Rollen + je n Geheimaufträge pro Person; Checkliste fürs Publikum = echte Aufträge + 3 falsche */
  function rollenVerteilung(a, m, seed) {
    const out = {}; mischen(m, rng(seed + "r")).forEach((pid, i) => { const ri = Math.min(i, a.rollen.length - 1); out[pid] = { rolle: ri, missionen: mischen(a.rollen[ri].missionen.map((_, k) => k), rng(seed + pid)).slice(0, a.anzahl || 2) }; });
    return out;
  }
  function rolleListe(a, m, seed) {
    const V = rollenVerteilung(a, m, seed), echt = new Set(); Object.values(V).forEach(v => v.missionen.forEach(k => echt.add(v.rolle + "_" + k)));
    const rest = []; [...new Set(Object.values(V).map(v => v.rolle))].forEach(ri => a.rollen[ri].missionen.forEach((_, k) => { if (!echt.has(ri + "_" + k)) rest.push(ri + "_" + k); }));
    return { V, echt, liste: mischen([...echt].concat(mischen(rest, rng(seed + "d")).slice(0, 3)), rng(seed + "l")) };
  }
  return { INTERAKTIV, TYP_ICON, TYP_NAME, autoPlan, paare, karteVon, teile, mischen, rng, ORTE, wegRunde, rollenVerteilung, rolleListe };
})();

/* ===================== Seite ===================== */
(function () {
  const F = window.FARSI, { $, $$, esc, toast } = F, LT = window.LIVE_TOOLS, LE = window.LEKTION_ENGINE, U = window.UNTERRICHT;
  const qs = new URLSearchParams(location.search);
  const MODUS = qs.get("leitung") ? "leitung" : "spieler", SPIEGEL = !!qs.get("spiegel"), PROBE = qs.get("probe");
  let CODE = (qs.get("code") || "").replace(/\D/g, "") || null;
  let G = null, REF = null, ME = null, IX = null, PLAN = null, PLANKEY = null, PLAENE = null;
  const LEK = {};       /* id → {eintrag, L} */
  let WAHL = { bereich: "a", lek: null }, LEINWAND = false, TN_KEY = null;
  const app = () => $("#app");
  const gRef = c => F.ref(`live/unterricht/${c}`);
  const SP = () => (G && G.spieler) || {};
  const name = id => (SP()[id] || {}).name || "?";
  const reihe = () => Object.entries(SP()).filter(([, s]) => s && s.name).sort(([, a], [, b]) => (a.ts || 0) - (b.ts || 0)).map(([id]) => id);
  const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  /* ---------- Teams ---------- */
  const TEAMS = { A: { fa: "تیمِ آزادی", de: "Team Azadi", icon: "🟦" }, B: { fa: "تیمِ تَجریش", de: "Team Tadschrisch", icon: "🟨" }, C: { fa: "تیمِ وَنَک", de: "Team Vanak", icon: "🟩" } };
  const teamIds = () => ["A", "B", "C"].slice(0, (G && G.teamZahl) || 0);
  const teamVon = id => ((G && G.gruppen) || {})[id];
  const mitglieder = t => reihe().filter(id => teamVon(id) === t);
  const teamName = t => TEAMS[t] ? TEAMS[t].icon + " " + TEAMS[t].de : t;
  /* Gruppen für Gruppenaufgaben: die Teams – oder, ohne Teams, Paare */
  function gruppenListe() {
    if (teamIds().length) return teamIds().map(t => ({ id: t, m: mitglieder(t) })).filter(g => g.m.length);
    return U.paare(reihe(), (G.aufgabe || {}).id || "x").gruppen.map((m, i) => ({ id: "P" + i, m }));
  }
  const gName = g => teamIds().length ? teamName(g.id) : g.m.map(name).join(" + ");
  function verteile(n, ids) { const o = {}; U.mischen(ids, U.rng("t" + Date.now())).forEach((id, i) => { o[id] = "ABC"[i % n]; }); return o; }
  /* Punkte: Übungen (Ø der Teammitglieder, max. 10, nur 1. Versuch) + Stadtplan + Rollenspiel/Bonus (log) */
  function punkte() {
    const T = teamIds(), P = {}; T.forEach(t => { P[t] = 0; }); if (!T.length) return P;

      zeigeKarte(a, $("#tnKarte"), (p, n) => { ergebnisSpeichern(p, n); const st = $("#tnStatus"); if (st) { st.style.display = ""; st.innerHTML = `✅ Geschafft${n ? `: ${p} von ${n}` : ""}! Warte auf die nächste Aufgabe … <button class="btn zwei klein" id="nochmalA">🔁 noch einmal</button>`; verdrahteNochmal(a); } });
      return;
    }
    const B = PLAN.bloecke[G.block || 0], t = Math.min(G.tafel || 0, Math.max(0, B.tafel.length - 1)), key = "t:" + (G.block || 0) + ":" + t + ":" + (G.handyTafel !== false) + ":" + teamVon(ME.id) + ":" + JSON.stringify(punkte());
    if (TN_KEY === key) return; TN_KEY = key;
    if (B.tafel.length && G.handyTafel !== false) { app().innerHTML = `${teamZeile()}${scoreHtml(false)}<div class="meldung" style="margin-top:12px">👀 <b>Schau nach vorn</b> – hier die Tafel zum Mitlesen.</div><div id="tnTafel"></div>`; zeigeKarte(B.tafel[t], $("#tnTafel")); }
    else app().innerHTML = `${teamZeile()}${scoreHtml(false)}<div class="karte" style="margin-top:20px;text-align:center"><div style="font-size:3rem">👀</div><h2>Schau nach vorn!</h2><p class="muted">${B.icon} ${esc(B.titel)}</p><p class="klein muted">Gleich gibt es hier die nächste Aufgabe.</p></div>`;
  }
  function verdrahteNochmal(a) { const b = $("#nochmalA"); if (b) b.onclick = () => { TN_KEY = null; $("#tnStatus") && ($("#tnStatus").style.display = "none"); zeigeKarte(a, $("#tnKarte"), (p, n) => { ergebnisSpeichern(p, n); TN_KEY = null; zeichne(); }); TN_KEY = "a:" + G.aufgabe.id; }; }

  /* ---------- Spezial-Aufgaben auf dem Handy ---------- */
  let LOK = {};
  function zeichneSpezial(a) {
    const id = G.aufgabe.id, ids = reihe(); if (LOK.id !== id) LOK = { id, antw: {} };
    let h = `${teamZeile()}<div class="meldung" style="margin-top:12px">${U.TYP_ICON[a.typ] || ""} <b>${esc(a.titel)}</b></div>`;
    if (a.typ === "interview") {
      const P = U.paare(ids, id), ziel = P.ziel[ME.id], felder = a._felder, mein = U.karteVon(felder, ME.id, id), e = meinErg();
      const antw = Object.assign({}, (e.antw || {}), LOK.antw);
      h += `<div class="karte"><h3 style="margin-top:0">🃏 Deine Familie <span class="klein muted">– so antwortest du</span></h3>${felder.map(f => { const w = f.werte[mein[f.key]]; return `<div class="zeile-f"><div class="d">${esc(f.frage[1])}</div><div class="f">${esc(w[0])} <button class="btn zwei klein" data-say="${esc(w[0])}">🔊</button></div></div>`; }).join("")}</div>`;
      if (!ziel) h += `<div class="meldung">Warte auf eine Partnerin / einen Partner …</div>`;
      else {
        const zk = U.karteVon(felder, ziel, id), geprueft = e.n != null;
        h += `<div class="karte" style="margin-top:12px"><h3 style="margin-top:0">❓ Frag ${esc(name(ziel))}</h3><p class="klein muted" style="margin-top:0">Stell die Frage auf Persisch und tippe an, was ${esc(name(ziel))} antwortet.</p>
          ${felder.map(f => `<div class="zeile-f"><div class="f">${esc(f.frage[0])} <button class="btn zwei klein" data-say="${esc(f.frage[0])}">🔊</button></div><div class="d">${esc(f.frage[1])}</div>
            <div class="opt-reihe">${f.werte.map((w, i) => `<button class="${geprueft ? (i === zk[f.key] ? "ok" : antw[f.key] === i ? "nein" : "") : antw[f.key] === i ? "an" : ""}" data-iw="${f.key}|${i}" ${geprueft ? "disabled" : ""}>${esc(w[0])}</button>`).join("")}</div></div>`).join("")}
          ${geprueft ? `<div class="meldung">✅ ${e.p} von ${e.n} richtig verstanden!</div>` : `<button class="btn" id="iPruef" style="margin-top:10px" ${felder.every(f => antw[f.key] != null) ? "" : "disabled"}>✔ prüfen</button>`}</div>`;
      }
      app().innerHTML = h;
      $$("[data-iw]").forEach(b => b.onclick = () => { const [k, i] = b.dataset.iw.split("|"); LOK.antw[k] = +i; ergRef().child("antw/" + k).set(+i).catch(() => { }); zeichneSpezial(a); });
      const ip = $("#iPruef"); if (ip) ip.onclick = () => { const zk = U.karteVon(felder, ziel, id); const p = felder.filter(f => LOK.antw[f.key] === zk[f.key]).length; ergRef().update({ p, n: felder.length, fertig: true, ts: Date.now() }).catch(() => { }); };
    } else if (a.typ === "puzzle") {
      const vert = puzzleVerteilung(a, ids), meine = vert.map((l, i) => l.includes(ME.id) ? i : -1).filter(i => i >= 0), aufl = !!G.aufgabe.aufl;
      if (!aufl) h += `<div class="karte"><h3 style="margin-top:0">📜 Dein Abschnitt</h3><p class="klein muted" style="margin-top:0">Lies ihn zuerst leise, dann – wenn du dran bist – <b>laut</b> vor. Danach entscheidet ihr gemeinsam die Reihenfolge.</p>
        ${meine.map(i => `<div class="teil" style="cursor:default">${a._teile[i].map(z => `<div class="fa-g" style="font-size:1.2rem;line-height:1.9">${esc(z.fa)} <button class="btn zwei klein" data-say="${esc(z.fa)}">🔊</button></div><details><summary class="klein">Hilfe</summary><div class="klein muted">${esc(z.tr || "")} – ${esc(z.de)}</div></details>`).join("")}</div>`).join("") || "<p>Du hörst diesmal zu und hilfst beim Ordnen.</p>"}</div>`;
      else h += `<div class="karte"><h3 style="margin-top:0">✔ Die richtige Reihenfolge</h3>${a._teile.map((t, i) => `<div class="teil" style="cursor:default"><div class="wer">${i + 1}. ${meine.includes(i) ? "⭐ dein Abschnitt" : ""}</div>${t.map(z => `<div class="fa-g" style="font-size:1.12rem">${esc(z.fa)}</div><div class="klein muted">${esc(z.de)}</div>`).join("")}</div>`).join("")}</div>`;
      app().innerHTML = h;
    } else if (a.typ === "sprechen") {
      const g = G.aufgabe.gezogen || [], dran = g[g.length - 1] === ME.id;
      h += `${dran ? `<div class="ich-dran">🎤 Du bist dran!</div>` : ""}<div class="karte" style="margin-top:10px"><p style="margin-top:0">${a.text || ""}</p>${(a.saetze || []).map(([fa, de]) => `<div class="zeile-f"><div class="f">${esc(fa)} <button class="btn zwei klein" data-say="${esc(fa)}">🔊</button></div><div class="d">${esc(de)}</div></div>`).join("")}</div>`;
      app().innerHTML = h;
    } else if (a.typ === "partner") {
      const P = U.paare(ids, id), grp = P.gruppen.find(x => x.includes(ME.id)) || [], andere = grp.filter(x => x !== ME.id), e = meinErg();
      h += `<div class="karte"><h3 style="margin-top:0">👥 Du sprichst mit: ${esc(andere.map(name).join(" und ") || "…")}</h3><p class="klein muted" style="margin-top:0">Fragt euch abwechselnd. Antwortet in ganzen Sätzen.</p>
        ${(a.fragen || []).map(([fa, de]) => `<div class="zeile-f"><div class="f">${esc(fa)} <button class="btn zwei klein" data-say="${esc(fa)}">🔊</button></div><div class="d">${esc(de)}</div></div>`).join("")}
        ${a.bericht ? `<div class="klein-h">Danach berichtest du im Plenum</div>${a.bericht.map(([fa, de]) => `<div class="zeile-f"><div class="f">${esc(fa)}</div><div class="d">${esc(de)}</div></div>`).join("")}` : ""}
        ${e.fertig ? `<div class="meldung">✅ Fertig gemeldet</div>` : `<button class="btn" id="pFertig" style="margin-top:10px">✓ Wir sind fertig</button>`}</div>`;
      app().innerHTML = h;
      const pf = $("#pFertig"); if (pf) pf.onclick = () => ergRef().update({ fertig: true, ts: Date.now() }).catch(() => { });
    }
    else if (a.typ === "weg") { app().innerHTML = h + wegTN(a, id); verdrahteWeg(a, id); }
    else if (a.typ === "rolle") { app().innerHTML = h + rolleTN(a, id); verdrahteRolle(a, id); }
    $$("[data-say]").forEach(b => b.onclick = e => { e.stopPropagation(); F.sprich(b.dataset.say); });
  }
  const zeileFa = ([fa, de]) => `<div class="zeile-f"><div class="f">${esc(fa)} <button class="btn zwei klein" data-say="${esc(fa)}">🔊</button></div><div class="d">${esc(de)}</div></div>`;
  function wegDaten(id) {
    const g = gruppenListe().find(x => x.m.includes(ME.id)); if (!g) return null;
    const s = wegStatus(id, g.id), r = s.r || 0, rd = U.wegRunde(id + g.id + r), guide = g.m[r % g.m.length], t = s.t || {}, rater = g.m.filter(x => x !== guide);
    return { g, s, r, rd, guide, t, rater, ichGuide: guide === ME.id, mein: t[ME.id] };
  }
  function wegTN(a, id) {
    const d = wegDaten(id); if (!d) return `<div class="meldung">Warte, bis du einer Gruppe zugeteilt bist …</div>`;
    const { g, s, r, rd, guide, t, rater, ichGuide, mein } = d, ziel = U.ORTE[rd.orte[rd.ziel]], getippt = rater.filter(x => t[x] != null).length;
    let h = `<p class="klein" style="margin:4px 0">${esc(gName(g))} · Runde ${r + 1} · <b>${s.p || 0} Punkte</b></p>`;
    if (s.auf) { const ok = rater.filter(x => t[x] === rd.ziel); h += `<div class="meldung">🎯 Das Ziel war ${ziel[0]} <span class="fa">${esc(ziel[1])}</span> (${esc(ziel[2])}). ${ok.length} von ${rater.length} richtig → +${ok.length} ${ok.length === 1 ? "Punkt" : "Punkte"}!</div>`; }
    else if (ichGuide) h += `<div class="ich-dran" style="font-size:1.05rem">🧭 Du bist Guide! Beschreib auf Persisch den Weg zum ⭐ – ohne den Namen zu sagen.</div><p style="margin:6px 0">🎯 Ziel: ${ziel[0]} <span class="fa">${esc(ziel[1])}</span> (${esc(ziel[2])})</p>`;
    else h += `<div class="meldung">👂 <b>${esc(name(guide))}</b> beschreibt dir den Weg. Hör zu und tippe das Ziel an.${mein != null ? " Du kannst noch ändern." : ""}</div>`;
    h += `<div class="plan">${rd.orte.map((o, k) => { let c = ""; if (s.auf) c = k === rd.ziel ? "ok" : (mein === k ? "nein" : ""); else if (ichGuide && k === rd.ziel) c = "ziel"; else if (!ichGuide && mein === k) c = "an"; return `<button class="ort ${c}" data-ort="${k}" ${ichGuide || s.auf ? "disabled" : ""}><span class="e">${U.ORTE[o][0]}</span><span class="n">${esc(U.ORTE[o][1])}</span></button>`; }).join("")}</div><div class="hier">⬆️<br>📍 <span class="fa">شُما اینجا هَستید</span> <span class="klein muted">(Du bist hier)</span></div>`;
    if (s.auf) h += `<button class="btn" id="wWeiter" style="width:100%">▶ Nächste Runde – ${esc(name(g.m[(r + 1) % g.m.length]))} ist Guide</button>`;
    else if (ichGuide) h += `<button class="btn" id="wAufl" style="width:100%" ${getippt === rater.length && rater.length ? "" : "disabled"}>✔ auflösen (${getippt} von ${rater.length} getippt)</button><details open style="margin-top:10px"><summary><b>So beschreibst du den Weg</b></summary>${WEG_RM.map(zeileFa).join("")}</details>`;
    else h += `<details style="margin-top:10px"><summary><b>Nachfragen</b></summary>${WEG_FRAGEN.map(zeileFa).join("")}</details>`;
    return h;
  }
  function verdrahteWeg(a, id) {
    const d = wegDaten(id); if (!d) return; const pfad = `teams/w/${id}/${d.g.id}`;
    $$("[data-ort]").forEach(b => b.onclick = () => tnRef(`${pfad}/t/${ME.id}`).set(+b.dataset.ort).catch(() => { }));
    const au = $("#wAufl"); if (au) au.onclick = () => { const ok = d.rater.filter(x => d.t[x] === d.rd.ziel).length; tnRef(pfad).update({ auf: true, p: (d.s.p || 0) + ok }).catch(() => { }); };
    const we = $("#wWeiter"); if (we) we.onclick = () => tnRef(pfad).update({ r: d.r + 1, auf: null, t: null }).catch(() => { });
  }
  function rolleKarte(a, g, V) {
    const v = V[ME.id], R = a.rollen[v.rolle];
    return `<div class="karte rolle tm-${g.id}" style="margin-top:10px"><div class="klein muted">${esc(a.situation[1])}</div><h3 style="margin:8px 0 4px">${R.icon} Deine Rolle: ${esc(R.name[1])} <span class="fa">${esc(R.name[0])}</span></h3><p style="margin:0 0 6px">${esc(R.aufgabe)}</p>
      <div class="klein-h">Das könnt ihr sagen (ugs.)</div>${R.redemittel.map(zeileFa).join("")}
      <div class="klein-h">🤫 Deine Geheimaufträge – bau sie unauffällig ein!</div>${v.missionen.map(k => `<div class="mission"><b>${esc(R.missionen[k][1])}</b><div class="fa-g" style="font-size:1.1rem">${esc(R.missionen[k][0])} <button class="btn zwei klein" data-say="${esc(R.missionen[k][0])}">🔊</button></div></div>`).join("")}
      <div class="klein-h">In deiner Gruppe</div><div class="klein">${g.m.map(id => `${esc(name(id))}: ${a.rollen[V[id].rolle].icon} ${esc(a.rollen[V[id].rolle].name[1])}`).join(" · ")}</div></div>`;
  }
  function rolleTN(a, id) {
    const g = gruppenListe().find(x => x.m.includes(ME.id)); if (!g) return `<div class="meldung">Warte, bis du einer Gruppe zugeteilt bist …</div>`;
    const V = U.rolleListe(a, g.m, id + g.id).V, bu = G.aufgabe.buehne, aufl = !!G.aufgabe.aufl;
    if (!bu) return `<div class="meldung">📝 Vorbereitung: Lest eure Rollen, übt das Gespräch in eurer Gruppe – und baut eure Geheimaufträge ein, ohne dass es auffällt!</div>` + rolleKarte(a, g, V);
    const bg = gruppenListe().find(x => x.id === bu); if (!bg) return rolleKarte(a, g, V);
    if (bg.id === g.id) { let h = `<div class="ich-dran">🎭 Ihr spielt jetzt vor!</div>`; if (aufl) { const w = rolleWertung(a, g); h += `<div class="meldung" style="margin-top:10px">Das Publikum hat ${w.erkannt.size} von ${w.echt.size} Geheimaufträgen erkannt.</div>`; } return h + rolleKarte(a, g, V); }
    const L = U.rolleListe(a, bg.m, id + bg.id), hab = ((meinErg().h || {})[bg.id]) || {};
    let h = `<div class="meldung">👂 <b>${esc(gName(bg))}</b> spielt vor. Welche Geheimaufträge hörst du? Hake an!</div>`;
    h += L.liste.map(k => { const [ri, mi] = k.split("_").map(Number), R = a.rollen[ri], an = !!hab[k], echt = L.echt.has(k); let c = an ? "an" : ""; if (aufl) c = echt ? (an ? "ok" : "verpasst") : (an ? "nein" : ""); return `<button class="check ${c}" data-mis="${k}" ${aufl ? "disabled" : ""}><span>${aufl ? (echt ? (an ? "✅" : "👂") : (an ? "❌" : "▫️")) : (an ? "☑️" : "⬜")}</span><span>${R.icon} <b>${esc(R.name[1])}</b> ${esc(R.missionen[mi][1])}${aufl && echt ? `<br><span class="fa">${esc(R.missionen[mi][0])}</span>` : ""}</span></button>`; }).join("");
    if (aufl) { const w = rolleWertung(a, bg); h += `<div class="meldung">Du bekommst ${w.proPerson[ME.id] || 0} ${w.proPerson[ME.id] === 1 ? "Punkt" : "Punkte"} für dein Team. ✅ richtig erkannt · 👂 überhört · ❌ war kein Auftrag</div>`; }
    return h + `<details style="margin-top:10px"><summary class="klein">Meine eigene Rolle</summary>${rolleKarte(a, g, V)}</details>`;
  }
  function verdrahteRolle(a, id) {
    const bu = G.aufgabe.buehne; $$("[data-mis]").forEach(b => b.onclick = () => { const k = b.dataset.mis, an = !!(((meinErg().h || {})[bu]) || {})[k]; ergRef().child(`h/${bu}/${k}`).set(an ? null : true).catch(() => { }); });
  }

  function zeichne() { MODUS === "leitung" ? zeichneLeitung() : zeichneSpieler(); }
  window.UNTERRICHT_APP = { zeichne, get G() { return G; }, get PLAN() { return PLAN; }, ladePlan };
  /* Einsicht/Vorschau im iframe der Leitung: ?spiegel=1&code=…&als=pid (live, nur lesen) oder &probe=b.i (Vorschau, lokal) */
  async function startSpiegel() {
    document.body.classList.add("spiegel"); if (!PROBE) document.body.classList.add("nurlesen");
    ME = { id: qs.get("als") || "", name: "" };
    if (!PROBE) { if (CODE) hoere(CODE); return; }
    let basis = null; if (CODE) { try { basis = (await F.mitTimeout(gRef(CODE).once("value"), 8000)).val(); } catch (e) { } }
    const [b, i] = PROBE.split(".").map(Number), fake = {}; FAKE_TN.forEach((n, k) => { fake["x" + (k + 1)] = { name: n, ts: k }; });
    const echt = basis && basis.spieler && Object.keys(basis.spieler).length >= 2;
    G = { phase: "spiel", lek: qs.get("lek") || (basis && basis.lek), plan: qs.get("plan") || (basis && basis.plan), block: b, tafel: 0, spieler: echt ? basis.spieler : fake, teamZahl: +qs.get("teams") || null, gruppen: echt ? basis.gruppen : null, aufgabe: { b, i, id: "probe" } };
    if (G.teamZahl && !G.gruppen) { G.gruppen = {}; reihe().forEach((id, k) => { G.gruppen[id] = "ABC"[k % G.teamZahl]; }); }
    if (!SP()[ME.id]) ME.id = reihe()[0];
    try { await ladePlan(G.lek, G.plan); } catch (e) { return fehler(e, true); }
    zeichne();
  }
  const FAKE_TN = ["Ana", "Ben", "Cem", "Dora", "Emil", "Fari"];
  F.initFB(); MODUS === "leitung" ? startLeitung() : SPIEGEL ? startSpiegel() : startSpieler();
})();
