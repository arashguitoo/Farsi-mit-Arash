<body>
<header class="kopf">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
(function () {
  const F = window.FARSI, { $, $$, esc, toast } = F, LT = window.LIVE_TOOLS, SW = window.SCHREIB_WERKZEUGE;
  const qs = new URLSearchParams(location.search);
  const MODUS = qs.get("leitung") ? "leitung" : "tn", PROBE = !!qs.get("probe");
  let CODE = (qs.get("code") || "").replace(/\D/g, "") || null;
  let G = null, REF = null, T = null, ME = null, TEIL = 0, LOK = { a: {}, hp: {} }, ANSICHT = qs.get("ansicht") === "bericht" ? "bericht" : "live";
  const app = () => $("#app");
  const gRef = c => F.ref(`live/test/${c}`);
  const SP = () => (G && G.spieler) || {};
  const AB = () => (G && G.teams && G.teams.ab) || {};
  const name = id => (SP()[id] || {}).name || "?";
  const reihe = () => Object.entries(SP()).filter(([, s]) => s && s.name).sort(([, a], [, b]) => (a.name || "").localeCompare(b.name || "", "de")).map(([id]) => id);
  const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const uhrzeit = ts => ts ? new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "–";
  const datum = ts => ts ? new Date(ts).toLocaleDateString("de-DE") : "";

  /* ---------- Test-Daten & Bewertung ---------- */
  const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  function rng(seed) { let a = hash(seed); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const mischen = (arr, r) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let ITEMS = [], MAX = 0;
  const TESTS = {};
  async function ladeTest(id) {
    if (!TESTS[id]) { const t = await F.ladeJSON("assets/test/" + id + ".json"), it = []; t.teile.forEach(tl => tl.items.forEach(i => it.push(Object.assign({ teil: tl.id }, i)))); TESTS[id] = { T: t, ITEMS: it, MAX: it.reduce((s, i) => s + maxPunkte(i), 0) }; }
    nutzeTest(id); return T;
  }
  function nutzeTest(id) { const x = TESTS[id]; if (x) { T = x.T; ITEMS = x.ITEMS; MAX = x.MAX; } }
  const maxPunkte = i => i.typ === "schreiben" ? (i.punkte || 5) : i.typ === "paare" ? i.paare.length : i.typ === "luecke" ? i.luecken.length : 1;
  const teilAnz = i => i.typ === "paare" ? i.paare.length : i.typ === "luecke" ? i.luecken.length : 0;
  const teilRichtig = (i, a, k) => a && typeof a === "object" && a["k" + k] != null && (i.typ === "paare" ? a["k" + k] === k : a["k" + k] === i.luecken[k].r);
  const teilText = (i, k, v) => v == null ? "–" : i.typ === "paare" ? (i.paare[v] || [])[1] : i.luecken[k].o[v];
  function punkte(i, a) { if (i.typ === "paare" || i.typ === "luecke") { let n = 0; for (let k = 0; k < teilAnz(i); k++) if (teilRichtig(i, a, k)) n++; return n; } return richtig(i, a) ? 1 : 0; }
  const hatAntwort = a => a != null && a !== "" && !(Array.isArray(a) && !a.length) && !(typeof a === "object" && !Array.isArray(a) && !Object.keys(a).length);
  const auto = i => i.typ !== "schreiben";
  function richtig(i, a) {
    if (a == null) return false;
    if (i.typ === "paare" || i.typ === "luecke") return punkte(i, a) === teilAnz(i);
    if (i.typ === "bauen") return Array.isArray(a) && a.length === i.teile.length && a.map(k => i.teile[k]).join(" ") === i.teile.join(" ");
    if (i.typ === "schreiben") return false;
    return a === i.r;
  }
  const antwortText = (i, a) => { if (a == null || a === "") return "–"; if (i.typ === "paare") return i.paare.map((p, k) => `${p[0]} → ${teilText(i, k, (a || {})["k" + k])}`).join(" · "); if (i.typ === "luecke") return i.luecken.map((l, k) => `(${k + 1}) ${teilText(i, k, (a || {})["k" + k])}`).join(" · "); if (i.typ === "bauen") return Array.isArray(a) ? a.map(k => i.teile[k]).join(" ") : "–"; if (i.typ === "schreiben") return String(a); return i.o[a] != null ? i.o[a] : "–"; };
  const loesungText = i => i.typ === "paare" ? i.paare.map(p => p[0] + " → " + p[1]).join(" · ") : i.typ === "luecke" ? i.luecken.map((l, k) => `(${k + 1}) ${l.o[l.r]}`).join(" · ") : i.typ === "bauen" ? i.teile.join(" ") : i.typ === "schreiben" ? "(manuell)" : i.o[i.r];
  const istFa = (i, txt) => i.optFa || i.typ === "bauen" || i.typ === "paare" || i.typ === "luecke" || i.typ === "schreiben" || /[؀-ۿ]/.test(txt || "");
  const ordnung = (i, pid) => i.fest ? i.o.map((_, k) => k) : mischen(i.o.map((_, k) => k), rng(pid + "|" + i.id));
  /* Auswertung einer Person */
  function auswerten(pid) {
    const E = AB()[pid] || {}, A = E.a || {}, bew = ((G && G.bewertung) || {})[pid] || {};
    let p = 0; const teile = {}, themen = {}, posten = [];
    ITEMS.forEach(i => {
      const a = A[i.id], mx = maxPunkte(i), ok = auto(i) ? richtig(i, a) : null, pk = auto(i) ? punkte(i, a) : (bew.schreiben != null ? Math.min(mx, +bew.schreiben) : null);
      if (pk != null) p += pk;
      const tl = teile[i.teil] = teile[i.teil] || { p: 0, max: 0, offen: 0 }, th = themen[i.thema] = themen[i.thema] || { p: 0, max: 0 };
      if (pk == null) tl.offen += mx; else { tl.p += pk; tl.max += mx; th.p += pk; th.max += mx; }
      posten.push({ i, a, ok, pk, mx, hp: (E.hp || {})[i.id] || 0 });
    });
    const maxBewertet = ITEMS.reduce((s, i) => s + (auto(i) || bew.schreiben != null ? maxPunkte(i) : 0), 0);
    return { p, max: maxBewertet, maxGesamt: MAX, proz: maxBewertet ? Math.round(100 * p / maxBewertet) : 0, teile, themen, posten, E, bew, beantwortet: ITEMS.filter(i => hatAntwort(A[i.id])).length };
  }
  const note = pr => pr >= 90 ? "sehr gut" : pr >= 80 ? "gut" : pr >= 65 ? "befriedigend" : pr >= 50 ? "ausreichend" : "noch nicht bestanden";
  const barKl = pr => pr >= 75 ? "" : pr >= 50 ? "mittel" : "schwach";
  const bar = pr => `<div class="bar ${barKl(pr)}" title="${pr} %"><i style="width:${pr}%"></i></div>`;
  /* Status einer Person */
  function status(pid) {
    const E = AB()[pid] || {};
    if (E.abgabe) return { k: "fertig", t: E.auto ? "abgegeben (Zeit um)" : "abgegeben", kl: "ok" };
    if (!E.start) return { k: "wartet", t: "noch nicht begonnen", kl: "nix" };
    if (Date.now() > ende(E)) return { k: "fertig", t: "Zeit abgelaufen", kl: "ok" };
    return { k: "laeuft", t: "schreibt gerade", kl: "lauf" };
  }
  const dauerMin = () => (G && G.dauer) || (T && T.dauer) || 60;
  const ende = E => (E.start || Date.now()) + (dauerMin() + (E.extra || 0)) * 60000;

  /* ---------- Firebase ---------- */
  function hoere(c) {
    if (REF) REF.off(); REF = gRef(c);
    REF.on("value", async s => {
      G = s.val();
      if (G) { try { await ladeTest(G.test || "persisch1"); } catch (e) { return fehler(e, true); } }
      if (MODUS !== "leitung") LT.pruefeNeuLaden(G);
      if (LT.tipptGerade(zeichne)) return; zeichne();
    }, e => fehler(e, true));
  }
  function fehler(e, hart) { console.error(e); if (!hart && G) { toast("Das hat nicht geklappt – bitte noch einmal tippen."); return; } app().innerHTML = `<div class="karte" style="margin-top:20px"><b>Das hat nicht geklappt.</b><p class="klein muted">${esc(e && e.message || e)}</p></div>`; }
  const upd = o => gRef(CODE).update(o).catch(e => fehler(e));
  /* Vorschau: alles nur lokal */
  function setzeLokal(t, v) { let o = G; for (let k = 0; k < t.length - 1; k++) o = o[t[k]] = (o[t[k]] && typeof o[t[k]] === "object") ? o[t[k]] : {}; if (v == null) delete o[t[t.length - 1]]; else o[t[t.length - 1]] = JSON.parse(JSON.stringify(v)); setTimeout(zeichne, 0); }
  const lokal = pfad => { const t = pfad.split("/"); return { set: v => { setzeLokal(t, v); return Promise.resolve(); }, update: o => { Object.entries(o).forEach(([k, v]) => setzeLokal(t.concat(k.split("/")), v)); return Promise.resolve(); } }; };
  const tnRef = pfad => PROBE ? lokal(pfad) : gRef(CODE).child(pfad);

  /* =====================================================================
     TEILNEHMENDE
     ===================================================================== */
  function pid() { let p = null; try { p = localStorage.getItem("farsi_quiz_pid"); if (!p) { p = "q" + Math.random().toString(36).slice(2, 9); localStorage.setItem("farsi_quiz_pid", p); } } catch (e) { p = "q" + Math.random().toString(36).slice(2, 9); } return p; }
  function gespeicherterName() { const s = F.sitzung && F.sitzung(); if (s && s.name) return s.name; try { return localStorage.getItem("farsi_quiz_name") || ""; } catch (e) { return ""; } }
  async function startTN() {
    if (PROBE) {
      ME = { id: "probe", name: "Vorschau" };
      G = { phase: "spiel", test: qs.get("test") || "persisch1-v2", spieler: { probe: { name: "Vorschau", ts: 1 } }, teams: { ab: {} }, zeigen: true };
      try { await ladeTest(G.test); } catch (e) { return fehler(e, true); }
      G.dauer = T.dauer; return zeichne();
    }
    ME = { id: pid(), name: gespeicherterName() };
    if (CODE && ME.name) beitreten(CODE, ME.name); else zeichneBeitritt();
  }
  function zeichneBeitritt(meld) {
    app().innerHTML = `<div class="karte" style="margin-top:20px;max-width:480px;margin-inline:auto;text-align:center"><div style="font-size:3rem">📝</div><h2 style="margin:0 0 6px">Online-Test</h2><p>Gib den <b>Test-Code</b> und deinen <b>Vornamen</b> ein.</p>
      <div style="display:grid;gap:10px;max-width:280px;margin:0 auto"><input class="feld" id="code" inputmode="numeric" maxlength="4" placeholder="Test-Code" value="${esc(CODE || "")}" style="text-align:center;font-size:1.4rem;letter-spacing:.2em"><input class="feld" id="name" maxlength="20" placeholder="Vorname" value="${esc(ME.name)}" style="text-align:center;font-size:1.15rem"><button class="btn" id="los">Weiter ➜</button></div>
      <p class="klein" style="color:var(--granat);min-height:1.2em">${meld || ""}</p></div>`;
    $("#los").onclick = () => beitreten($("#code").value.replace(/\D/g, ""), $("#name").value.trim());
    $$("#code,#name").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") $("#los").click(); }));
  }
  async function beitreten(c, n) {
    if (!/^\d{4}$/.test(c)) return zeichneBeitritt("Der Test-Code hat vier Ziffern."); if (!n) return zeichneBeitritt("Bitte gib deinen Vornamen ein.");
    n = n.split(/\s+/)[0].slice(0, 20);
    let g; try { g = (await F.mitTimeout(gRef(c).once("value"), 8000)).val(); } catch (e) { return fehler(e, true); }
    if (!g || !g.test) { CODE = null; return zeichneBeitritt("Diesen Test-Code gibt es nicht."); }
    CODE = c; ME.name = n; try { localStorage.setItem("farsi_quiz_name", n); } catch (e) { }
    history.replaceState(null, "", "?code=" + c);
    try { if ((g.spieler || {})[ME.id]) await gRef(c).child(`spieler/${ME.id}/name`).set(n); else await gRef(c).child("spieler/" + ME.id).set({ name: n, ts: Date.now() }); } catch (e) { return fehler(e, true); }
    LT.verbindung(gRef(c).child("spieler/" + ME.id)); hoere(c);
  }
  const meinE = () => AB()[ME.id] || {};
  const antwort = id => LOK.a[id] !== undefined ? LOK.a[id] : (meinE().a || {})[id];
  const gehoert = id => Math.max(LOK.hp[id] || 0, (meinE().hp || {})[id] || 0);
  function speichern(id, wert) { LOK.a[id] = wert; tnRef(`teams/ab/${ME.id}/a/${id}`).set(wert === undefined ? null : wert).catch(() => toast("⚠️ Antwort nicht gespeichert – Verbindung prüfen!")); }
  let ABGABE_LAEUFT = false;
  function abgeben(autom) {
    if (ABGABE_LAEUFT) return; ABGABE_LAEUFT = true;
    const o = { abgabe: Date.now(), auto: !!autom }; Object.entries(LOK.a).forEach(([k, v]) => { o["a/" + k] = v === undefined ? null : v; });
    tnRef(`teams/ab/${ME.id}`).update(o).then(() => { ABGABE_LAEUFT = false; }).catch(() => { ABGABE_LAEUFT = false; toast("⚠️ Abgabe hat nicht geklappt – bitte noch einmal tippen."); });
  }
  function zeichneTN() {
    document.body.classList.remove("imtest");
    if (!G) return zeichneBeitritt("Diesen Test gibt es nicht (mehr).");

    $("#kopfTitel").textContent = "📝 " + T.titel;
    const ids = reihe(), st = ids.map(status), fertig = st.filter(s => s.k === "fertig").length, laeuft = st.filter(s => s.k === "laeuft").length;
    let h = `<div class="nodruck" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px"><div><span class="klein muted">Test-Code </span><span class="lv-code">${CODE}</span> <span class="klein muted">· ${esc(location.host + location.pathname.replace(/[^/]*$/, ""))}code.html · ${dauerMin()} Min. · angelegt ${datum(G.erstellt)}</span></div>
      <div class="btnreihe">${G.phase === "warten" ? `<button class="btn" id="freigeben">▶ Test freigeben</button>` : G.phase === "spiel" ? `<button class="btn rot" id="beenden">⏹ Test beenden</button>` : `<button class="btn zwei" id="oeffnen">↺ wieder öffnen</button>`}
      <label class="klein"><input type="checkbox" id="zeigen" ${G.zeigen ? "checked" : ""}> Ergebnis den TN zeigen</label><a class="btn zwei klein" href="?leitung=1" style="text-decoration:none">📚 Archiv / neuer Test</a></div></div>
      <div class="nodruck" style="margin:6px 0"><input class="feld" id="bezeichnung" placeholder="Bezeichnung für das Archiv, z. B. „Persisch I – WS 26/27, Gruppe Mo“" value="${esc(G.bezeichnung || "")}" style="width:100%;max-width:520px"></div>
      <div class="meldung nodruck">${G.phase === "warten" ? "⏳ Die TN können sich schon anmelden, aber noch nicht beginnen." : G.phase === "spiel" ? `🟢 Test läuft · ${laeuft} schreiben gerade · ${fertig} fertig · ${ids.length - laeuft - fertig} noch nicht begonnen` : "🔒 Test beendet – keine Antworten mehr möglich."}</div>
      <div class="seg nodruck" style="margin:6px 0 10px"><button class="${ANSICHT === "live" ? "an" : ""}" data-ansicht="live">👥 Teilnehmende (live)</button><button class="${ANSICHT === "bericht" ? "an" : ""}" data-ansicht="bericht">📊 Bericht</button></div>`;
    h += ANSICHT === "live" ? liveHtml(ids) : berichtHtml(ids);
    LT.render(app(), h);
    verdrahteLeitung();
  }
  function liveHtml(ids) {
    if (!ids.length) return `<p class="muted">Noch niemand angemeldet.</p>`;
    return `<table class="rep"><tr><th>Name</th><th>Status</th><th>Beginn</th><th>Restzeit</th><th>Teil</th><th>beantwortet</th><th>Punkte</th><th class="nodruck"></th></tr>${ids.map(id => {
      const s = status(id), E = AB()[id] || {}, R = auswerten(id);
      return `<tr><td><b>${esc(name(id))}</b></td><td><span class="pill ${s.kl}">${s.t}</span></td><td>${uhrzeit(E.start)}</td><td class="z">${s.k === "laeuft" ? `<span data-ende="${ende(E)}">${fmt(ende(E) - Date.now())}</span>` : "–"}${E.extra ? ` <span class="klein muted">(+${E.extra})</span>` : ""}</td><td>${E.teil ? esc(E.teil) : "–"}</td><td class="z">${R.beantwortet}/${ITEMS.length}</td><td class="z">${s.k === "fertig" ? `${R.p}/${R.max} · ${R.proz} %` : "–"}</td>
        <td class="nodruck">${s.k === "laeuft" ? `<button class="min-btn" data-extra="${id}">+5 Min.</button> <button class="min-btn" data-zwang="${id}">abgeben</button>` : ""}${s.k === "wartet" ? `<button class="min-btn" data-weg="${id}">✕</button>` : ""}</td></tr>`; }).join("")}</table>
      <p class="klein muted">Alle Antworten werden live gespeichert. „+5 Min.“ verlängert die Zeit für eine Person, „abgeben“ beendet den Test für sie.</p>`;
  }
  /* ---------- Bericht ---------- */
  function berichtHtml(ids) {
    const fertig = ids.filter(id => status(id).k === "fertig"), laufend = ids.filter(id => status(id).k === "laeuft");
    const basis = fertig.length ? fertig : laufend;
    if (!basis.length) return `<p class="muted">Sobald jemand abgegeben hat, erscheint hier der Bericht.</p>`;
    const R = {}; basis.forEach(id => { R[id] = auswerten(id); });
    const proz = basis.map(id => R[id].proz).sort((a, b) => a - b), mittel = Math.round(proz.reduce((s, x) => s + x, 0) / proz.length), median = proz[Math.floor((proz.length - 1) / 2)];
    const offenSchreiben = basis.filter(id => R[id].bew.schreiben == null && ITEMS.some(i => !auto(i))).length;
    /* Themen über alle */
    const themen = {}; ITEMS.forEach(i => { themen[i.thema] = themen[i.thema] || { p: 0, max: 0 }; });
    basis.forEach(id => Object.entries(R[id].themen).forEach(([k, v]) => { themen[k].p += v.p; themen[k].max += v.max; }));
    const thProz = Object.entries(themen).filter(([, v]) => v.max).map(([k, v]) => [k, Math.round(100 * v.p / v.max)]).sort((a, b) => b[1] - a[1]);
    const stark = thProz.filter(x => x[1] >= 80).map(x => x[0]), schwach = thProz.filter(x => x[1] < 60).map(x => x[0]);
    let h = `<div class="nodruck btnreihe" style="margin-bottom:8px"><button class="btn zwei klein" id="drucken">🖨 Drucken / als PDF</button><button class="btn zwei klein" id="csv">⬇ CSV (Excel)</button><button class="btn zwei klein" id="alleAuf">alle Einzelberichte aufklappen</button></div>
      <div class="karte"><h2 style="margin-top:0">📊 Bericht: ${esc(T.titel)}${G.bezeichnung ? ` – ${esc(G.bezeichnung)}` : ""}</h2><p class="klein muted" style="margin-top:0">Test-Code ${CODE} · ${datum(G.erstellt)} · ${dauerMin()} Min. · ${fertig.length} abgegeben${laufend.length ? `, ${laufend.length} noch dabei${fertig.length ? "" : " (vorläufiger Stand)"}` : ""}${offenSchreiben ? ` · <b>Schreibteil bei ${offenSchreiben} Person(en) noch nicht bewertet</b> – Prozente beziehen sich bis dahin auf die automatisch bewerteten Aufgaben` : ""}</p>
      <div class="kpi"><div>Durchschnitt<b>${mittel} %</b></div><div>Median<b>${median} %</b></div><div>Spanne<b>${proz[0]}–${proz[proz.length - 1]} %</b></div><div>bestanden (≥ 50 %)<b>${proz.filter(x => x >= 50).length} / ${proz.length}</b></div></div>
      <div class="klein-h">Kurz gesagt</div><ul>
        ${stark.length ? `<li>💪 <b>Gut gefestigt:</b> ${stark.map(esc).join(", ")}</li>` : ""}
        ${schwach.length ? `<li>🔁 <b>Wiederholen:</b> ${schwach.map(esc).join(", ")}</li>` : "<li>Kein Thema liegt im Durchschnitt unter 60 %.</li>"}
        ${(() => { const h2 = thProz.find(x => x[0] === "Hören"); return h2 ? `<li>🎧 Hören: ${h2[1]} % – im Mittel ${Math.round(basis.reduce((s, id) => s + ITEMS.filter(i => i.audio).reduce((a, i) => a + ((R[id].E.hp || {})[i.id] || 0), 0), 0) / basis.length / Math.max(1, ITEMS.filter(i => i.audio).length) * 10) / 10}-mal pro Aufnahme abgespielt</li>` : ""; })()}
      </ul>
      <div class="klein-h">Themen (alle TN)</div><table class="rep">${thProz.map(([k, p]) => `<tr><td>${esc(k)}</td><td class="z" style="width:60px">${p} %</td><td style="width:50%">${bar(p)}</td></tr>`).join("")}</table></div>`;
    /* Übersicht pro Person */
    h += `<div class="karte" style="margin-top:12px"><h3 style="margin-top:0">Übersicht pro Person</h3><div style="overflow-x:auto"><table class="rep"><tr><th>Name</th><th>Punkte</th><th>%</th><th>Einschätzung</th>${T.teile.map(t => `<th title="${esc(t.titel)}">${t.icon} ${t.id}</th>`).join("")}<th>Zeit</th></tr>
      ${basis.slice().sort((a, b) => R[b].proz - R[a].proz).map(id => { const x = R[id], E = x.E, zeit = E.start ? Math.round(((E.abgabe || Math.min(Date.now(), ende(E))) - E.start) / 60000) : 0;
        return `<tr><td><b>${esc(name(id))}</b>${status(id).k === "laeuft" ? ' <span class="pill lauf">läuft</span>' : ""}</td><td class="z">${x.p}/${x.max}</td><td class="z"><b>${x.proz}</b></td><td>${note(x.proz)}</td>${T.teile.map(t => { const y = x.teile[t.id]; if (!y) return "<td></td>"; if (!y.max) return `<td class="klein muted">offen</td>`; const pr = Math.round(100 * y.p / y.max); return `<td class="z" style="color:${pr < 50 ? "var(--granat)" : pr < 75 ? "#8a6000" : "var(--gruen)"}">${pr}</td>`; }).join("")}<td class="z">${zeit} Min.</td></tr>`; }).join("")}</table></div>
      <p class="klein muted">Einschätzung: ab 90 % sehr gut · ab 80 % gut · ab 65 % befriedigend · ab 50 % ausreichend.</p></div>`;
    /* Aufgabenanalyse */
    h += `<div class="karte" style="margin-top:12px"><h3 style="margin-top:0">Aufgabenanalyse</h3><p class="klein muted" style="margin-top:0">Wie viele haben die Aufgabe gelöst – und welche falsche Antwort kam am häufigsten?</p><div style="overflow-x:auto"><table class="rep"><tr><th>Nr.</th><th>Aufgabe</th><th>Lösung</th><th>richtig</th><th>häufigster Fehler</th></tr>
      ${ITEMS.filter(auto).map(i => { const ant = basis.map(id => (R[id].E.a || {})[i.id]), pr = Math.round(100 * ant.reduce((s, a) => s + punkte(i, a), 0) / (basis.length * maxPunkte(i)));
        const falsch = {}; ant.forEach(a => { if (teilAnz(i)) { for (let k = 0; k < teilAnz(i); k++) if (!teilRichtig(i, a, k)) { const t = (i.typ === "paare" ? i.paare[k][0] + " → " : `(${k + 1}) `) + teilText(i, k, (a || {})["k" + k]); falsch[t] = (falsch[t] || 0) + 1; } } else if (!richtig(i, a)) { const t = antwortText(i, a); falsch[t] = (falsch[t] || 0) + 1; } }); const hf = Object.entries(falsch).sort((a, b) => b[1] - a[1])[0];
        return `<tr><td><b>${i.id}</b></td><td>${i.frage}${i.fa ? ` <span class="fa">${esc(i.fa)}</span>` : ""}${i.audio ? ` <span class="klein muted">🎧 <span class="fa">${esc(i.audio)}</span></span>` : ""}</td><td class="${istFa(i, loesungText(i)) ? "fa" : ""}">${esc(loesungText(i))}</td><td style="min-width:110px">${pr} % ${bar(pr)}</td><td>${hf ? `<span class="${istFa(i, hf[0]) ? "fa" : ""}">${esc(hf[0])}</span> <span class="klein muted">(${hf[1]}×)</span>` : "–"}</td></tr>`; }).join("")}</table></div></div>`;
    /* Einzelberichte */
    h += `<div class="karte" style="margin-top:12px"><h3 style="margin-top:0">Einzelberichte</h3>${basis.map(id => einzelHtml(id, R[id])).join("")}</div>`;
    return h;
  }
  function einzelHtml(id, x) {
    const E = x.E, th = Object.entries(x.themen).filter(([, v]) => v.max).map(([k, v]) => [k, Math.round(100 * v.p / v.max)]);
    const gut = th.filter(t => t[1] >= 80).map(t => t[0]), ueben = th.filter(t => t[1] < 60).map(t => t[0]);
    const schreibItem = ITEMS.find(i => i.typ === "schreiben"), text = schreibItem ? (E.a || {})[schreibItem.id] : null;
    let h = `<details class="person" data-merk="p-${id}"><summary>${esc(name(id))} – ${x.p}/${x.max} Punkte · ${x.proz} % · ${note(x.proz)}</summary>
      <p class="klein muted">Beginn ${uhrzeit(E.start)} · Abgabe ${uhrzeit(E.abgabe)}${E.auto ? " (automatisch, Zeit um)" : ""}${E.extra ? ` · +${E.extra} Min. Verlängerung` : ""} · ${x.beantwortet}/${ITEMS.length} beantwortet</p>
      <p>${gut.length ? `💪 <b>Stärken:</b> ${gut.map(esc).join(", ")}<br>` : ""}${ueben.length ? `🔁 <b>Üben:</b> ${ueben.map(esc).join(", ")}` : "Keine Themen unter 60 %."}</p>
      <table class="rep" style="margin-bottom:8px">${th.map(([k, p]) => `<tr><td>${esc(k)}</td><td class="z" style="width:60px">${p} %</td><td style="width:45%">${bar(p)}</td></tr>`).join("")}</table>`;
    if (schreibItem) h += `<div class="klein-h">✍️ Schreiben (${schreibItem.punkte || 5} P.)</div><div class="tlese" style="font-size:1.15rem">${text ? esc(text).replace(/\n/g, "<br>") : '<span class="klein muted" style="direction:ltr">(nichts geschrieben)</span>'}</div>
      <div class="nodruck" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0"><label class="klein">Punkte <input class="feld" type="number" min="0" max="${schreibItem.punkte || 5}" step="0.5" value="${x.bew.schreiben ?? ""}" data-bew="${id}" style="width:70px"></label><input class="feld" placeholder="Notiz für dich (optional)" value="${esc(x.bew.notiz || "")}" data-notiz="${id}" style="flex:1;min-width:200px"></div>
      ${x.bew.schreiben != null ? `<p class="klein">Bewertet: <b>${x.bew.schreiben}</b> von ${schreibItem.punkte || 5}${x.bew.notiz ? ` · ${esc(x.bew.notiz)}` : ""}</p>` : ""}`;
    h += `<div class="klein-h">Alle Antworten</div>${T.teile.filter(t => t.items.some(auto)).map(t => `<div class="klein" style="font-weight:800;margin-top:6px">${t.icon} ${esc(t.titel)}</div>${x.posten.filter(p => p.i.teil === t.id && auto(p.i)).map(p => `<div class="ant"><span>${p.ok ? "✅" : p.pk > 0 ? "🟡" : "❌"} <b>${p.i.id}</b>${p.mx > 1 ? ` <span class="klein">${p.pk}/${p.mx}</span>` : ""}</span><span>${p.i.frage}${p.i.fa ? ` <span class="fa">${esc(p.i.fa)}</span>` : ""}${p.i.audio ? ` <span class="klein muted">🎧 ${p.hp}× gehört</span>` : ""}</span><span class="${istFa(p.i, antwortText(p.i, p.a)) ? "fa" : ""}">${esc(antwortText(p.i, p.a))}</span><span class="${istFa(p.i, loesungText(p.i)) ? "fa" : ""}" style="color:var(--gruen)">${p.ok ? "" : esc(loesungText(p.i))}</span></div>`).join("")}`).join("")}`;
    return h + `</details>`;
  }
  function csv(ids) {
    const fertig = ids.filter(id => status(id).k !== "wartet"), q = s => `"${String(s).replace(/"/g, '""')}"`;
    const kopf = ["Name", "Punkte", "Max", "Prozent", "Einschätzung"].concat(T.teile.map(t => t.titel + " %"), ITEMS.map(i => i.id), ["Schreiben (Text)", "Notiz"]);
    const zeilen = fertig.map(id => { const x = auswerten(id); return [name(id), x.p, x.max, x.proz, note(x.proz)].concat(T.teile.map(t => { const y = x.teile[t.id]; return y && y.max ? Math.round(100 * y.p / y.max) : ""; }), x.posten.map(p => auto(p.i) ? p.pk : (x.bew.schreiben ?? "")), [((x.E.a || {})[(ITEMS.find(i => i.typ === "schreiben") || {}).id] || ""), x.bew.notiz || ""]); });
    const text = "﻿" + [kopf].concat(zeilen).map(z => z.map(q).join(";")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" })); a.download = `test-${CODE}-${datum(G.erstellt)}.csv`; document.body.appendChild(a); a.click(); a.remove();
  }
  function verdrahteLeitung() {
    const fr = $("#freigeben"); if (fr) fr.onclick = () => upd({ phase: "spiel", freigabe: Date.now() });
    const be = $("#beenden"); if (be) be.onclick = () => { const l = reihe().filter(id => status(id).k === "laeuft").length; if (confirm(l ? `${l} Person(en) schreiben noch. Ihre bisherigen Antworten bleiben gespeichert. Test wirklich beenden?` : "Test beenden? Danach kann niemand mehr antworten.")) upd({ phase: "ende" }); };
    const oe = $("#oeffnen"); if (oe) oe.onclick = () => upd({ phase: "spiel" });
    const ze = $("#zeigen"); if (ze) ze.onchange = () => upd({ zeigen: ze.checked });
    const bz = $("#bezeichnung"); if (bz) bz.onchange = () => upd({ bezeichnung: bz.value.trim().slice(0, 80) || null });
    $$("[data-ansicht]").forEach(b => b.onclick = () => { ANSICHT = b.dataset.ansicht; zeichne(); });
    $$("[data-extra]").forEach(b => b.onclick = () => { const id = b.dataset.extra; upd({ [`teams/ab/${id}/extra`]: ((AB()[id] || {}).extra || 0) + 5 }); });
    $$("[data-zwang]").forEach(b => b.onclick = () => { if (confirm(`Test für ${name(b.dataset.zwang)} jetzt beenden?`)) upd({ [`teams/ab/${b.dataset.zwang}/abgabe`]: Date.now(), [`teams/ab/${b.dataset.zwang}/auto`]: true }); });
    $$("[data-weg]").forEach(b => b.onclick = () => { if (confirm(`${name(b.dataset.weg)} entfernen?`)) upd({ [`spieler/${b.dataset.weg}`]: null }); });
    $$("[data-bew]").forEach(i => i.onchange = () => { const v = i.value === "" ? null : Math.max(0, Math.min(+i.max, +i.value)); upd({ [`bewertung/${i.dataset.bew}/schreiben`]: v }); });
    $$("[data-notiz]").forEach(i => i.onchange = () => upd({ [`bewertung/${i.dataset.notiz}/notiz`]: i.value.trim() || null }));
    const dr = $("#drucken"); if (dr) dr.onclick = () => { $$("details.person").forEach(d => d.open = true); setTimeout(() => window.print(), 100); };
    const cs = $("#csv"); if (cs) cs.onclick = () => csv(reihe());
    const al = $("#alleAuf"); if (al) al.onclick = () => $$("details.person").forEach(d => d.open = true);
  }

  /* Uhr: jede Sekunde aktualisieren, bei 0 automatisch abgeben */
  setInterval(() => {
    $$("[data-ende]").forEach(el => { const rest = +el.dataset.ende - Date.now(); el.textContent = fmt(rest); el.classList.toggle("rot", rest < 60000); el.classList.toggle("warn", rest >= 60000 && rest < 5 * 60000); });
    if (MODUS === "tn" && G && T && ME && G.phase === "spiel") { const E = meinE(); if (E.start && !E.abgabe && Date.now() > ende(E)) { abgeben(true); } }
  }, 1000);

  function zeichne() { MODUS === "leitung" ? zeichneLeitung() : zeichneTN(); }
  window.TEST_APP = { get G() { return G; }, auswerten, get ITEMS() { return ITEMS; } };
  if (!PROBE) F.initFB();
  MODUS === "leitung" ? startLeitung() : startTN();
})();
</script>
</body>
</html>
